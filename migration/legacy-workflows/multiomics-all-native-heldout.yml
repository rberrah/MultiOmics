name: Multi-omics ALL unselected-probe native heldout calibration

on:
  pull_request:
    paths:
      - '.github/workflows/multiomics-all-native-heldout.yml'
      - 'scripts/export_all_unselected_pmx.R'
      - 'scripts/benchmark_all_unselected_pmx.mjs'
      - 'scripts/evaluate_all_unselected_pmx.R'
      - 'src/lib/multiomics/**'
      - 'multiomics-engine/external_validation.R'
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiomics-all-native-heldout.yml'
      - 'scripts/export_all_unselected_pmx.R'
      - 'scripts/benchmark_all_unselected_pmx.mjs'
      - 'scripts/evaluate_all_unselected_pmx.R'
      - 'src/lib/multiomics/**'
  schedule:
    - cron: '41 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-unselected:
    name: PMx native 12,625-probe BCR/ABL vs NEG holdout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout immutable official Bioconductor ALL data
        uses: actions/checkout@v5
        with:
          repository: bioconductor-source/ALL
          ref: c705298153f878e49cd2b60f80c615d569ebd3c2
          path: external/ALL
          sparse-checkout: |
            data/ALL.rda
            DESCRIPTION
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install R Biobase and JSON input/output dependencies
        run: |
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install("Biobase",ask=FALSE,update=FALSE)'
      - run: npm ci
      - name: Export ALL measured unselected probes and blind test labels
        run: |
          Rscript scripts/export_all_unselected_pmx.R \
            external/ALL tmp/multiomics/all-native
      - name: Run real PMx frozen training on all 12,625 probes
        run: node scripts/benchmark_all_unselected_pmx.mjs tmp/multiomics/all-native
      - name: Reveal heldout molecular phenotype only to R evaluator
        run: Rscript scripts/evaluate_all_unselected_pmx.R tmp/multiomics/all-native
      - name: Archive all results, including performance failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pmx-all-unselected-12500-plus-holdout
          path: |
            tmp/multiomics/all-native/source-contract.json
            tmp/multiomics/all-native/frozen-pmx-model.json
            tmp/multiomics/all-native/frozen-pmx-predictions.csv
            tmp/multiomics/all-native/pmx-train-label-null-predictions.csv
            tmp/multiomics/all-native/all-native-heldout-report.json
          if-no-files-found: warn
