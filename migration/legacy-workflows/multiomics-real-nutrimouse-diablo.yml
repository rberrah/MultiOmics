name: Multi-omics real public Nutrimouse DIABLO biological validation

on:
  pull_request:
    paths:
      - '.github/workflows/multiomics-real-nutrimouse-diablo.yml'
      - 'multiomics-engine/tests/test_diablo_real_nutrimouse.R'
      - 'multiomics-engine/tests/test_diablo_real_nutrimouse_ablation.R'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation_benchmarks.R'
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiomics-real-nutrimouse-diablo.yml'
      - 'multiomics-engine/tests/test_diablo_real_nutrimouse.R'
      - 'multiomics-engine/tests/test_diablo_real_nutrimouse_ablation.R'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation_benchmarks.R'
  schedule:
    - cron: '13 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-paired-studies:
    name: Real mixOmics DIABLO on 40 Nutrimouse animals with true RNA-lipid pairing
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: Download immutable official mixOmics experimental source
        uses: actions/checkout@v5
        with:
          repository: mixOmics-org/mixOmics
          ref: ef3e760526623d9e91e945e4b50be48d764efc40
          path: external/mixOmics
          sparse-checkout: |
            data/nutrimouse.rda
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install real mixOmics plus JSON audit dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglpk40
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install("mixOmics",ask=FALSE,update=FALSE); stopifnot(requireNamespace("mixOmics",quietly=TRUE))'
      - name: Run genuine paired multi-omic DIABLO with untouched subjects and negative controls
        run: |
          Rscript multiomics-engine/tests/test_diablo_real_nutrimouse.R \
            external/mixOmics tmp/multiomics/real-nutrimouse-diablo
      - name: Compare genuine DIABLO against actual single-omic sPLS-DA on identical heldouts
        run: |
          Rscript multiomics-engine/tests/test_diablo_real_nutrimouse_ablation.R \
            external/mixOmics tmp/multiomics/real-nutrimouse-diablo
      - name: Archive ALL outcomes even if observed model performs poorly
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-real-nutrimouse-diablo-true-observations
          path: tmp/multiomics/real-nutrimouse-diablo/
          if-no-files-found: warn
