name: Multi-omics real PMx frozen model on publisher holdout

on:
  pull_request:
    paths:
      - '.github/workflows/multiomics-native-heldout.yml'
      - 'scripts/export_tcga_native_pmx.R'
      - 'scripts/benchmark_tcga_native_pmx.mjs'
      - 'scripts/evaluate_tcga_native_pmx.R'
      - 'src/lib/multiomics/**'
      - 'multiomics-engine/external_validation.R'
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiomics-native-heldout.yml'
      - 'scripts/export_tcga_native_pmx.R'
      - 'scripts/benchmark_tcga_native_pmx.mjs'
      - 'scripts/evaluate_tcga_native_pmx.R'
      - 'src/lib/multiomics/**'
  schedule:
    - cron: '23 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-heldout:
    name: Freeze PMx ridge model and independently evaluate publisher holdout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout official TCGA training and test source
        uses: actions/checkout@v5
        with:
          repository: mixOmics-org/mixOmics
          ref: ef3e760526623d9e91e945e4b50be48d764efc40
          path: external/mixOmics
          sparse-checkout: |
            data/breast.TCGA.rda
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install R reporting library
        run: Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
      - run: npm ci
      - name: Split real source into labelled training and outcome-blinded heldout
        run: |
          Rscript scripts/export_tcga_native_pmx.R \
            external/mixOmics tmp/multiomics/tcga-native
      - name: Train real PMx core algorithm and freeze out-of-sample probabilities
        run: node scripts/benchmark_tcga_native_pmx.mjs tmp/multiomics/tcga-native
      - name: Reveal holdout labels only for independent R metric evaluation
        run: |
          Rscript scripts/evaluate_tcga_native_pmx.R tmp/multiomics/tcga-native
      - name: Archive frozen model, source contract, scores, diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-pmx-native-publisher-heldout
          path: |
            tmp/multiomics/tcga-native/source-contract.json
            tmp/multiomics/tcga-native/frozen-pmx-model.json
            tmp/multiomics/tcga-native/frozen-pmx-predictions.csv
            tmp/multiomics/tcga-native/pmx-train-label-null-predictions.csv
            tmp/multiomics/tcga-native/pmx-native-heldout-report.json
          if-no-files-found: warn
