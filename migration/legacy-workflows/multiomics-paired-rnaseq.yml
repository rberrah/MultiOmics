name: MultiOmics paired RNA-seq reference

on:
  pull_request:
    paths:
      - 'multiomics-engine/paired_rnaseq_reference.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/tests/test_paired_rnaseq_backend.R'
      - 'multiomics-engine/tests/test_public_airway_paired_backend.R'
      - 'scripts/test_public_airway_website_r_numeric_figures.mjs'
      - 'multiomics-engine/research_reproducibility_notebook.Rmd'
      - 'multiomics-engine/render_research_notebook.R'
      - 'src/lib/multiomics/r-markdown-source.js'
      - 'src/lib/multiomics/r-markdown-renderer-source.js'
      - 'src/lib/multiomics/r-primary-results.js'
      - 'src/lib/multiomics/visualization-data.js'
      - 'multiomics-engine/plot_research_figures.R'
      - '.github/workflows/multiomics-paired-rnaseq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-reference:
    name: True paired biological units — DESeq2 and voom, complete results, negative designs
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v5
      - name: Check actual Bioconductor, DESeq2, edgeR and limma packages
        shell: bash
        run: |
          Rscript -e '
            extras <- c("BiocManager","jsonlite","statmod","digest","plumber")
            missing <- extras[!vapply(extras,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing))install.packages(missing,repos="https://cloud.r-project.org")
            stopifnot(identical(as.character(BiocManager::version()),"3.22"))
            bioc <- c("DESeq2","edgeR","limma","airway")
            missing_bioc <- bioc[!vapply(bioc,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing_bioc))BiocManager::install(missing_bioc,update=FALSE,ask=FALSE,quiet=TRUE)
            stopifnot(all(vapply(c(extras,bioc),requireNamespace,logical(1),quietly=TRUE)))
          '
      - name: Syntax and design-safe paired preflight
        run: |
          Rscript -e '
            parse("multiomics-engine/server.R")
            parse("multiomics-engine/paired_rnaseq_reference.R")
            parse("multiomics-engine/tests/test_paired_rnaseq_backend.R")
            cat("PAIRED-RNA-SEQ R PARSE PASS\n")
          '
      - name: Real 4-pair DESeq2/limma-voom replay plus unbalanced and confounded cases
        run: Rscript multiomics-engine/tests/test_paired_rnaseq_backend.R
      - name: Public Airway GSE52778 genuine paired-reference backend and native DESeq2 comparison
        env:
          PMX_PAIRED_AIRWAY_REPORT_DIR: /tmp/paired-airway-evidence
        run: Rscript multiomics-engine/tests/test_public_airway_paired_backend.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install R Markdown and Pandoc for public-cohort research replay
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq pandoc
          fi
          apt-get update -qq
          apt-get install -y -qq libuv1-dev libssl-dev libcurl4-openssl-dev libxml2-dev
          Rscript -e 'for(p in c("rmarkdown","knitr")) if(!requireNamespace(p,quietly=TRUE)) install.packages(p,repos="https://cloud.r-project.org"); stopifnot(rmarkdown::pandoc_available())'
      - name: Airway public study — compare complete native R statistics with site numbers and figure plots
        env:
          PMX_PAIRED_AIRWAY_REPORT_DIR: /tmp/paired-airway-evidence
          PMX_TEST_RMD: '1'
        run: node scripts/test_public_airway_website_r_numeric_figures.mjs
      - name: Preserve reproducible public biological pairing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-airway-GSE52778-true-backend-evidence
          path: /tmp/paired-airway-evidence/
          if-no-files-found: warn
          retention-days: 60
      - name: Assert Plumber imports remain operational
        run: |
          Rscript -e 'p<-plumber::plumb("multiomics-engine/server.R");stopifnot(inherits(p,"Plumber"));cat("PAIRED R PLUMBER PASS\n")'
