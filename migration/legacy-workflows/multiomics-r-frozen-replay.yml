name: MultiOmics R RNA-seq frozen reference replay

on:
  pull_request:
    paths:
      - 'multiomics-engine/reproducibility/**'
      - '.github/workflows/multiomics-r-frozen-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

# This job is separate from Codex RNA-seq 400-study calibration.
# It tests reproducibility of one synthetic example, not nominal FDR.
jobs:
  capture:
    name: Capture reference methods in digest-pinned Bioconductor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v5
      - name: Install Bioconductor 3.22 reference dependencies
        shell: bash
        run: |
          Rscript -e '
            repos <- "https://cloud.r-project.org"
            needed <- c("BiocManager","renv","jsonlite","statmod")
            missing <- needed[!vapply(needed,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing)) install.packages(missing,repos=repos)
            stopifnot(identical(as.character(BiocManager::version()),"3.22"))
            bioc <- c("DESeq2","edgeR","limma")
            missing_bioc <- bioc[!vapply(bioc,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing_bioc))
              BiocManager::install(missing_bioc,ask=FALSE,update=FALSE,quiet=TRUE)
            stopifnot(all(vapply(c(needed,bioc),requireNamespace,logical(1),quietly=TRUE)))
          '
      - name: Capture real reference fits, exact package versions and renv lock
        run: |
          Rscript multiomics-engine/reproducibility/rnaseq_replay.R capture tmp/omics-r-frozen
          git -c safe.directory="$PWD" rev-parse HEAD > tmp/omics-r-frozen/source-commit.txt
          sha256sum tmp/omics-r-frozen/* > tmp/omics-r-frozen/SHA256SUMS
      - name: Replay from a second R process in capture environment
        run: Rscript multiomics-engine/reproducibility/rnaseq_replay.R replay tmp/omics-r-frozen
      - name: Retain complete capture evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiomics-rnaseq-frozen-input-and-lock
          path: tmp/omics-r-frozen
          if-no-files-found: warn
          retention-days: 30

  independently-restore:
    name: Restore lockfile in separate clean pinned container and replay
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: multiomics-rnaseq-frozen-input-and-lock
          path: tmp/omics-r-frozen
      - name: Install lockfile bootstrap (not unpinned statistical engines)
        run: |
          Rscript -e '
            if(!requireNamespace("renv",quietly=TRUE))
              install.packages("renv",repos="https://cloud.r-project.org")
          '
      - name: Restore the captured, exact reference dependency versions
        shell: bash
        run: |
          export RENV_PATHS_LIBRARY="$PWD/tmp/omics-r-restored-library"
          mkdir -p "$RENV_PATHS_LIBRARY"
          Rscript -e '
            renv::restore(project=getwd(),
              lockfile="tmp/omics-r-frozen/renv.lock",
              library=Sys.getenv("RENV_PATHS_LIBRARY"),
              prompt=FALSE,clean=FALSE)
          '
      - name: Run replay with restored library first and block package drift
        shell: bash
        run: |
          export R_LIBS_USER="$PWD/tmp/omics-r-restored-library"
          export PMX_RESTORED_LIBRARY="$R_LIBS_USER"
          Rscript multiomics-engine/reproducibility/rnaseq_replay.R replay tmp/omics-r-frozen
      - name: Retain independent-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiomics-rnaseq-independent-replay
          path: |
            tmp/omics-r-frozen/replay-result.txt
            tmp/omics-r-frozen/runtime_manifest.json
            tmp/omics-r-frozen/renv.lock
          if-no-files-found: warn
          retention-days: 30
