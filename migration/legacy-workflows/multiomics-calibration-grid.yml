name: Multi-omics independent-group calibration grid

on:
  pull_request:
    paths:
      - 'scripts/test_multiomics_calibration_grid.mjs'
      - '.github/workflows/multiomics-calibration-grid.yml'
      - 'src/lib/multiomics/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'scripts/test_multiomics_calibration_grid.mjs'
      - '.github/workflows/multiomics-calibration-grid.yml'
      - 'src/lib/multiomics/**'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    name: Predeclared multi-scenario calibration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Calibration grid (independent 2-group models only)
        env:
          MULTIOMICS_CALIBRATION_REPORT_PATH: tmp/multiomics/calibration-grid.json
        run: node scripts/test_multiomics_calibration_grid.mjs
      - name: Retain transparent calibration metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-independent-group-calibration
          path: tmp/multiomics/calibration-grid.json
          if-no-files-found: warn
