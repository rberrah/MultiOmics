name: Multi-omics public-site accessibility smoke

# A push/PR smoke targets GitHub Pages BEFORE the changed commit is
# deployed, producing false failures on valid PRs and stale assets. Only check
# the real public website after the successful Pages deployment completes.
# The scientific CI already tests unmerged PRs against their own local builds.
on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-routes:
    name: Check beginner entry and tool on real GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check HTTP responses and prerendered content
        shell: bash
        run: |
          set -euo pipefail
          for route in '' 'multiomics/' 'multiomics/tool/'; do
            url="https://rberrah.github.io/$route"
            file="$(mktemp)"
            status="$(curl --location --silent --show-error --retry 5 --retry-delay 12 --retry-connrefused --max-time 30 -o "$file" -w '%{http_code}' "$url")"
            echo "$url: HTTP $status, $(wc -c <"$file") bytes"
            if [[ "$status" != "200" ]]; then
              echo "::error::The public beginner entry point is unavailable: $url"
              exit 1
            fi
            if [[ ! -s "$file" ]]; then
              echo "::error::The public page returned empty content: $url"
              exit 1
            fi
            if [[ "$route" == "multiomics/tool/" ]] &&
               ! grep -Eiq 'multi.?omique|multi.?omics|Omics' "$file"; then
              echo "::error::The tool endpoint did not provide expected prerendered content."
              exit 1
            fi
            rm -f "$file"
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for real public-site visual interaction
        run: npx playwright install chromium --with-deps
      - name: Verify desktop/mobile hydration and run the real public demo
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages/CDN may briefly serve its previous version immediately
          # after workflow success. Retry the complete real-browser validation,
          # but never suppress a persistent failure.
          for attempt in 1 2 3; do
            if node scripts/check_live_multiomics.mjs; then
              echo "Public live check passed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::The deployed multi-omics beginner demo failed all three browser attempts"
          exit 1
