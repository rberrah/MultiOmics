name: MultiOmics public airway biological replay

on:
  pull_request:
    paths:
      - 'multiomics-engine/tests/test_public_airway_reference_replay.R'
      - '.github/workflows/multiomics-public-airway-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-airway-reference:
    name: Real GSE52778 paired cells / dex -> DESeq2 -> complete reference export
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    env:
      PMX_AIRWAY_REPORT_DIR: /tmp/pmx-public-airway-report
    steps:
      - name: Application, validation and R backend — identical checked-out integration commit
        uses: actions/checkout@v5
      - name: Install the public Bioconductor airway data and R reference packages
        shell: bash
        run: |
          Rscript -e '
            needed <- c("BiocManager","jsonlite")
            missing <- needed[!vapply(needed,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing)) install.packages(missing,repos="https://cloud.r-project.org")
            stopifnot(identical(as.character(BiocManager::version()),"3.22"))
            bioc <- c("airway","DESeq2")
            missing_bioc <- bioc[!vapply(bioc,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing_bioc))
              BiocManager::install(missing_bioc,ask=FALSE,update=FALSE,quiet=TRUE)
            stopifnot(all(vapply(c(needed,bioc),requireNamespace,logical(1),quietly=TRUE)))
          '
      - name: Analyze actual paired airway cohort; independent wrapper-vs-native numerical comparison
        shell: bash
        run: |
          Rscript multiomics-engine/tests/test_public_airway_reference_replay.R
          python3 - <<'PY'
          import json, os
          filename=os.path.join(os.environ['PMX_AIRWAY_REPORT_DIR'],'airway_public_reference_replay.json')
          with open(filename,encoding='utf-8') as fh:
              m=json.load(fh)
          assert m['accession']=='GSE52778'
          assert m['samples']==8 and m['independent_biological_units']==4
          assert m['complete_reference_rows']==m['fitted_genes']>10000
          assert m['expected_marker']['treatment_log2_fold_change']>0
          assert m['expected_marker']['adjusted_p']<0.05
          assert m['statistical_certification'] is False
          assert m['independent_cohort_validation'] is False
          print("AIRWAY PUBLIC EVIDENCE REPORT: PASS",m['fitted_genes'])
          PY
      - name: Preserve public-dataset benchmarking metadata and package versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airway-GSE52778-biological-reference-validation
          path: /tmp/pmx-public-airway-report/
          if-no-files-found: warn
          retention-days: 60
