name: Multi-omics RNA-seq paired prefilter and normalization sensitivity

# No statistical calibration assertion may be inferred from the workflow
# success. A short PR run checks executable scientific contracts; longer
# independent paired campaigns are available on manual or monthly runs.
on:
  pull_request:
    paths:
      - 'multiomics-engine/rnaseq_filter_sensitivity.R'
      - 'multiomics-engine/tests/test_rnaseq_filter_sensitivity.R'
      - 'multiomics-engine/tests/bioconductor_rnaseq_filter_sensitivity.R'
      - 'multiomics-engine/rnaseq_stress_designs.R'
      - 'multiomics-engine/mixed_truth_reference_metrics.R'
      - 'multiomics-engine/advanced_methods.R'
      - '.github/workflows/multiomics-rnaseq-filter-sensitivity.yml'
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Paired independently simulated studies per scenario'
        type: choice
        required: true
        default: '80'
        options: ['40', '80', '120']
  schedule:
    - cron: '17 4 8 * *'

permissions:
  contents: read

jobs:
  reference-preprocessing-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Cache reference R Bioconductor
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: multiomics-prefilter-${{ runner.os }}-${{ hashFiles('multiomics-engine/advanced_methods.R', 'multiomics-engine/tests/bioconductor_rnaseq_filter_sensitivity.R') }}
      - name: Test label-blind simulated gene filtering and paired reporting in pure base R
        run: Rscript multiomics-engine/tests/test_rnaseq_filter_sensitivity.R
      - name: Test synthetic study generator and known planted biological truth
        run: Rscript multiomics-engine/tests/test_rnaseq_stress_designs.R
      - name: Test dataset-level FDR and power definitions
        run: Rscript multiomics-engine/tests/test_mixed_truth_reference_metrics.R
      - name: Install real DESeq2, edgeR, limma and statmod
        run: |
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install(c("DESeq2","edgeR","limma","statmod"), ask=FALSE, update=FALSE)'
      - name: Run paired comparisons of native preprocessing and strict independent filtering
        env:
          MULTIOMICS_FILTER_SENSITIVITY_REPLICATES: ${{ github.event_name == 'pull_request' && '8' || (inputs.repetitions || '80') }}
          MULTIOMICS_VALIDATION_OUTPUT: validation-artifacts
        run: Rscript multiomics-engine/tests/bioconductor_rnaseq_filter_sensitivity.R
      - name: Archive normalization changes, per-study FDR/power, paired differences and package versions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rnaseq-paired-prefilter-reference-validation
          path: validation-artifacts/*
          if-no-files-found: warn
