name: MultiOmics downstream exchange v1

on:
  pull_request:
    paths:
      - 'docs/multiomics/DOWNSTREAM_EXCHANGE_V1*'
      - 'scripts/validate_multiomics_exchange.py'
      - 'scripts/test_validate_multiomics_exchange.py'
      - 'scripts/test_multiomics_downstream_export.mjs'
      - 'scripts/capture_multiomics_python_environment.py'
      - 'multiomics-engine/capture_environment.R'
      - 'multiomics-engine/*.R'
      - 'src/lib/multiomics/reference-r-sources.js'
      - 'src/lib/multiomics/reference-replay.js'
      - 'scripts/test_multiomics_r_source_replay.mjs'
      - 'multiomics-engine/verify_research_replay.R'
      - 'src/lib/multiomics/r-numeric-verifier-source.js'
      - 'src/lib/multiomics/r-run-all-source.js'
      - 'scripts/test_multiomics_r_figures.mjs'
      - 'multiomics-engine/research_reproducibility_notebook.Rmd'
      - 'multiomics-engine/render_research_notebook.R'
      - 'src/lib/multiomics/r-markdown-source.js'
      - 'src/lib/multiomics/r-markdown-renderer-source.js'
      - 'src/routes/multiomics/learn/+page.svelte'
      - 'src/lib/multiomics/r-figure-source.js'
      - 'scripts/test_verify_multiomics_r_replay.py'
      - 'scripts/verify_multiomics_r_replay.py'
      - 'src/lib/multiomics/reference-replay-verifier-source.js'
      - 'src/routes/multiomics/tool/+page.svelte'
      - 'src/lib/multiomics/downstream-exchange.js'
      - 'src/lib/multiomics/research-export-package.js'
      - '.github/workflows/multiomics-exchange-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/multiomics/DOWNSTREAM_EXCHANGE_V1*'
      - 'scripts/validate_multiomics_exchange.py'
      - 'scripts/test_validate_multiomics_exchange.py'
      - '.github/workflows/multiomics-exchange-contract.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate downstream exchange contract fixtures
        run: python scripts/test_validate_multiomics_exchange.py
      - name: Check native R replay numerical comparator
        run: python scripts/test_verify_multiomics_r_replay.py
      - name: Capture real Python environment inventory
        run: |
          python scripts/capture_multiomics_python_environment.py --output python-environment-ci.json
          python -c 'import json; x=json.load(open("python-environment-ci.json")); assert x["status"] == "inventory_only_not_a_dependency_lock" and x["python_version"]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install Linux R Markdown system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libuv1-dev libssl-dev libcurl4-openssl-dev libxml2-dev
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install R figure, replay and R Markdown dependencies
        run: |
          Rscript -e 'for(p in c("jsonlite","rmarkdown","knitr")) if (!requireNamespace(p, quietly=TRUE)) install.packages(p, repos="https://cloud.r-project.org"); stopifnot(requireNamespace("rmarkdown",quietly=TRUE), rmarkdown::pandoc_available())'
      - name: Parse and check exact reference R replay scripts
        run: node scripts/test_multiomics_r_source_replay.mjs
      - name: Generate and inspect R-based research figures
        run: node scripts/test_multiomics_r_figures.mjs
      - name: Validate downloaded ZIP and render actual commented R Markdown HTML
        env:
          PMX_TEST_RMD: '1'
        run: node scripts/test_multiomics_downstream_export.mjs
