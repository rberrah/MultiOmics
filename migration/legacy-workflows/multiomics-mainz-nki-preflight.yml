name: Multi-omics frozen PMx MAINZ Affymetrix to NKI Agilent assay transfer

on:
  pull_request:
    paths:
      - '.github/workflows/multiomics-mainz-nki-preflight.yml'
      - 'scripts/preflight_mainz_nki_crossplatform.R'
      - 'scripts/export_mainz_nki_crossplatform.R'
      - 'scripts/benchmark_mainz_nki_crossplatform.mjs'
      - 'scripts/evaluate_mainz_nki_crossplatform.R'
      - 'src/lib/multiomics/**'
      - 'multiomics-engine/external_validation.R'
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiomics-mainz-nki-preflight.yml'
      - 'scripts/preflight_mainz_nki_crossplatform.R'
      - 'scripts/export_mainz_nki_crossplatform.R'
      - 'scripts/benchmark_mainz_nki_crossplatform.mjs'
      - 'scripts/evaluate_mainz_nki_crossplatform.R'
      - 'src/lib/multiomics/**'
  schedule:
    - cron: '31 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossplatform:
    name: Freeze MAINZ-only native PMx model and blind-score independent Agilent NKI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: bioconductor-source/breastCancerMAINZ
          ref: 63e11105cb8a7c854264e9a13f8c926b39f20ab0
          path: external/MAINZ
          sparse-checkout: |
            data/mainz.rda
      - uses: actions/checkout@v5
        with:
          repository: bioconductor-source/breastCancerNKI
          ref: 94e197403d6adaeae613cdc95997ac6ac5b5a88e
          path: external/NKI
          sparse-checkout: |
            data/nki.rda
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install R Biobase and JSON evaluation libraries
        run: |
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install("Biobase",ask=FALSE,update=FALSE)'
      - run: npm ci
      - name: Audit actual gene annotation and biological ER status
        run: Rscript scripts/preflight_mainz_nki_crossplatform.R
      - name: Build identical unambiguous Entrez gene panels and outcome-blinded external inputs
        run: |
          Rscript scripts/export_mainz_nki_crossplatform.R \
            external/MAINZ external/NKI tmp/multiomics/mainz-nki
      - name: Fit, persist and replay two native PMx models without external labels
        run: node scripts/benchmark_mainz_nki_crossplatform.mjs tmp/multiomics/mainz-nki
      - name: Evaluate all NKI labels after both models and negative controls were frozen
        run: Rscript scripts/evaluate_mainz_nki_crossplatform.R tmp/multiomics/mainz-nki
      - name: Archive all mapped-gene, model and calibration evidence (including negative results)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pmx-mainz-to-nki-cross-platform-evidence
          path: |
            tmp/multiomics/mainz-nki/source-contract.json
            tmp/multiomics/mainz-nki/frozen-models-summary.json
            tmp/multiomics/mainz-nki/primary_rank/frozen-pmx-model.json
            tmp/multiomics/mainz-nki/primary_rank/external-predictions.csv
            tmp/multiomics/mainz-nki/primary_rank/native-train-null-predictions.csv
            tmp/multiomics/mainz-nki/sensitivity_raw/frozen-pmx-model.json
            tmp/multiomics/mainz-nki/sensitivity_raw/external-predictions.csv
            tmp/multiomics/mainz-nki/sensitivity_raw/native-train-null-predictions.csv
            tmp/multiomics/mainz-nki/mainz-nki-crossplatform-pmx-report.json
          if-no-files-found: warn
