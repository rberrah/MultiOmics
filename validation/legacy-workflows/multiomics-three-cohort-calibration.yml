name: Multi-omics retrospective independent-cohort calibration MAINZ TRANSBIG NKI

on:
  pull_request:
    paths:
      - '.github/workflows/multiomics-three-cohort-calibration.yml'
      - 'scripts/export_transbig_calibration_pmx.R'
      - 'scripts/score_transbig_calibration_pmx.mjs'
      - 'scripts/fit_transbig_calibration_pmx.R'
      - 'scripts/evaluate_transbig_calibration_pmx.R'
      - 'scripts/export_mainz_nki_crossplatform.R'
      - 'scripts/benchmark_mainz_nki_crossplatform.mjs'
      - 'multiomics-engine/external_validation.R'
      - 'src/lib/multiomics/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiomics-three-cohort-calibration.yml'
      - 'scripts/export_transbig_calibration_pmx.R'
      - 'scripts/score_transbig_calibration_pmx.mjs'
      - 'scripts/fit_transbig_calibration_pmx.R'
      - 'scripts/evaluate_transbig_calibration_pmx.R'
  schedule:
    - cron: '47 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective-calibration:
    name: Recalibrate on TRANSBIG only; retrospectively assess NKI without refit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: bioconductor-source/breastCancerMAINZ
          ref: 63e11105cb8a7c854264e9a13f8c926b39f20ab0
          path: external/MAINZ
          sparse-checkout: |
            data/mainz.rda
      - uses: actions/checkout@v5
        with:
          repository: bioconductor-source/breastCancerTRANSBIG
          ref: 44c052727769c051f965035725953b6883865743
          path: external/TRANSBIG
          sparse-checkout: |
            data/transbig.rda
      - uses: actions/checkout@v5
        with:
          repository: bioconductor-source/breastCancerNKI
          ref: 94e197403d6adaeae613cdc95997ac6ac5b5a88e
          path: external/NKI
          sparse-checkout: |
            data/nki.rda
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install statistical R and Bioconductor tools
        run: |
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install("Biobase",ask=FALSE,update=FALSE)'
      - run: npm ci
      - name: Harmonize MAINZ/NKI Entrez genes without inspecting test outcomes
        run: |
          Rscript scripts/export_mainz_nki_crossplatform.R \
            external/MAINZ external/NKI tmp/multiomics/mainz-nki
      - name: Fit native PMx on MAINZ, freeze full models and score blinded NKI
        run: node scripts/benchmark_mainz_nki_crossplatform.mjs tmp/multiomics/mainz-nki
      - name: Export separate Affymetrix TRANSBIG calibrator cohort, labels hidden
        run: |
          Rscript scripts/export_transbig_calibration_pmx.R \
            external/MAINZ external/TRANSBIG tmp/multiomics/mainz-nki
      - name: Apply frozen MAINZ PMx coefficients to unlabeled TRANSBIG
        run: node scripts/score_transbig_calibration_pmx.mjs tmp/multiomics/mainz-nki
      - name: Fit intercept on TRANSBIG only and blind-apply it to NKI
        run: Rscript scripts/fit_transbig_calibration_pmx.R tmp/multiomics/mainz-nki
      - name: Reveal previously-studied NKI labels for RETROSPECTIVE evaluation only
        run: Rscript scripts/evaluate_transbig_calibration_pmx.R tmp/multiomics/mainz-nki
      - name: Archive all results including performance deterioration
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pmx-three-cohort-retrospective-calibration-audit
          path: |
            tmp/multiomics/mainz-nki/source-contract.json
            tmp/multiomics/mainz-nki/transbig-calibration-contract.json
            tmp/multiomics/mainz-nki/transbig-scoring-contract.json
            tmp/multiomics/mainz-nki/primary_rank/frozen-pmx-model.json
            tmp/multiomics/mainz-nki/primary_rank/external-predictions.csv
            tmp/multiomics/mainz-nki/primary_rank/transbig-calibration-frozen-scores.csv
            tmp/multiomics/mainz-nki/primary_rank/transbig-only-calibrator.json
            tmp/multiomics/mainz-nki/primary_rank/nki-frozen-transbig-calibrated-scores.csv
            tmp/multiomics/mainz-nki/sensitivity_raw/frozen-pmx-model.json
            tmp/multiomics/mainz-nki/sensitivity_raw/external-predictions.csv
            tmp/multiomics/mainz-nki/sensitivity_raw/transbig-calibration-frozen-scores.csv
            tmp/multiomics/mainz-nki/sensitivity_raw/transbig-only-calibrator.json
            tmp/multiomics/mainz-nki/sensitivity_raw/nki-frozen-transbig-calibrated-scores.csv
            tmp/multiomics/mainz-nki/three-cohort-retrospective-calibration-report.json
          if-no-files-found: warn
