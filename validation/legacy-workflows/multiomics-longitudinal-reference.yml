name: Multi-omics independent longitudinal reference

on:
  pull_request:
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/tests/test_longitudinal_backend.R'
      - '.github/workflows/multiomics-longitudinal-reference.yml'
  push:
    branches: [main]
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/tests/test_longitudinal_backend.R'
      - '.github/workflows/multiomics-longitudinal-reference.yml'
  schedule:
    - cron: '07 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longitudinal:
    name: Longitudinal R lmerTest reference and design refusals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install established R longitudinal reference
        run: Rscript -e 'install.packages(c("lme4","lmerTest"))'
      - name: Check explicit contrast, full BH family and null controls
        run: Rscript multiomics-engine/tests/test_longitudinal_backend.R
