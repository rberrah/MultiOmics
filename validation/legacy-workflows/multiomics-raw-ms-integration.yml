name: Multi-omics raw MS integration

on:
  push:
    branches: [main]
    paths:
      - 'multiomics-engine/raw_ms_processing.R'
      - 'multiomics-engine/run_raw_ms.R'
      - 'multiomics-engine/tests/raw_ms_xcms_integration.R'
      - '.github/workflows/multiomics-raw-ms-integration.yml'
  workflow_dispatch:

# This is deliberately separate from the fast scientific contract suite because
# it installs the full Bioconductor LC-MS stack and executes real raw files.
concurrency:
  group: multiomics-raw-ms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xcms-faahko:
    name: xcms on public faahKO raw CDF
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Native dependencies used by Rhdf5lib/mzR/igraph and their transitive
      # Bioconductor dependencies. Keeping them explicit makes the integration
      # test independent of changes in the hosted runner image.
      - name: Install raw-MS system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libhdf5-dev \
            libglpk-dev \
            libnetcdf-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev

      - name: Install Bioconductor raw-MS stack and public data
        run: |
          Rscript -e "install.packages('BiocManager', repos='https://cloud.r-project.org'); BiocManager::install(c('xcms','MsExperiment','Spectra','mzR','BiocParallel','faahKO','jsonlite'), ask=FALSE, update=FALSE)"
          Rscript -e "required <- c('xcms','MsExperiment','Spectra','mzR','BiocParallel','faahKO','jsonlite'); missing <- required[!vapply(required, requireNamespace, logical(1), quietly=TRUE)]; if (length(missing)) stop(paste('Missing packages after installation:', paste(missing, collapse=', ')))"

      - name: Execute raw MS pipeline on public faahKO files
        run: Rscript multiomics-engine/tests/raw_ms_xcms_integration.R
