name: MultiOmics — researcher-ready reproducible ZIP

on:
  pull_request:
    paths:
      - 'src/lib/multiomics/research-export-package.js'
      - 'src/routes/multiomics/tool/+page.svelte'
      - 'scripts/test_multiomics_research_export_package.mjs'
      - 'tests/e2e/multiomics-research-bundle.spec.js'
      - 'tests/e2e/multiomics-methods-learning.spec.js'
      - 'src/routes/multiomics/learn/+page.svelte'
      - 'src/routes/multiomics/+page.svelte'
      - 'src/lib/multiomics/r-markdown-source.js'
      - 'src/lib/multiomics/r-markdown-renderer-source.js'
      - '.github/workflows/multiomics-research-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  researcher-results:
    name: Complete scientific tables, audited ZIP, interactive upload and export
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit validation — escaping, ZIP, SHA256, sensitive source and methodology
        run: node scripts/test_multiomics_research_export_package.mjs
      - name: Typecheck
        run: npm run check
      - name: Build site
        run: npm run build
      - run: npx playwright install chromium --with-deps
      - name: Thirty real ZIP exports on first attempt (six workflows × five, no retries)
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-research-bundle.spec.js --workers=1 --retries=0 --repeat-each=5
      - name: Guided MultiOmics scientific method lessons (FR, beginner usability)
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-methods-learning.spec.js --workers=1 --retries=0
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: omics-research-bundle-regression-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
