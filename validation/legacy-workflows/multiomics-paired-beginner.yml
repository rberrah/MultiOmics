name: MultiOmics paired study beginner accessibility

on:
  pull_request:
    paths:
      - 'src/lib/multiomics/paired-study-client.js'
      - 'src/routes/multiomics/tool/+page.svelte'
      - 'scripts/test_multiomics_paired_study.mjs'
      - 'tests/e2e/multiomics-paired-beginner.spec.js'
      - '.github/workflows/multiomics-paired-beginner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beginner-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Paired subject counts, original IDs, missing biological pairs and contrast guards
        run: node scripts/test_multiomics_paired_study.mjs
      - name: Svelte accessibility, type checking and server binding
        run: npm run check
      - name: Static deployed-site build
        run: npm run build
      - name: Install actual Chromium
        run: npx playwright install chromium --with-deps
      - name: Researcher sample upload, visible pair counts and refusal without R
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-paired-beginner.spec.js --workers=1
      - name: Preserve failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omics-paired-beginner-browser-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
