name: Multi-omics full Bioconductor reference benchmark

# This job installs the actual Bioconductor statistical packages. It is
# deliberately separate from the fast syntax/contract smoke tests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/tests/bioconductor_reference_simulation.R'
      - 'multiomics-engine/tests/bioconductor_null_calibration.R'
      - 'multiomics-engine/null_reference_metrics.R'
      - 'multiomics-engine/tests/test_null_reference_metrics.R'
      - 'multiomics-engine/mixed_truth_reference_metrics.R'
      - 'multiomics-engine/tests/test_mixed_truth_reference_metrics.R'
      - 'multiomics-engine/tests/bioconductor_mixed_truth_reference.R'
      - '.github/workflows/multiomics-bioconductor-validation.yml'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  bioconductor-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Cache installed R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: multiomics-bioconductor-${{ runner.os }}-r-${{ hashFiles('multiomics-engine/tests/bioconductor_reference_simulation.R', 'multiomics-engine/tests/bioconductor_null_calibration.R') }}
      - name: Verify independent mixed-truth FDR, power and bootstrap metrics
        run: Rscript multiomics-engine/tests/test_mixed_truth_reference_metrics.R
      - name: Verify exact confidence bounds without Bioconductor
        run: Rscript multiomics-engine/tests/test_null_reference_metrics.R
      - name: Install full reference statistical stack
        run: |
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install(c("DESeq2", "edgeR", "limma", "statmod"), ask=FALSE, update=FALSE)'
      - name: Fit real DESeq2, edgeR quasi-likelihood and limma-voom models
        run: Rscript multiomics-engine/tests/bioconductor_reference_simulation.R
      - name: Quantify empirical false-discovery probability under complete null
        env:
          MULTIOMICS_NULL_REPLICATES: '12'
          MULTIOMICS_NULL_STRESS_REPLICATES: '8'
          MULTIOMICS_VALIDATION_OUTPUT: validation-artifacts
        run: Rscript multiomics-engine/tests/bioconductor_null_calibration.R
      - name: Calibrate mixed-truth FDR and planted signal recovery with real reference R
        env:
          MULTIOMICS_MIXED_REFERENCE_REPLICATES: '12'
          MULTIOMICS_VALIDATION_OUTPUT: validation-artifacts
        run: Rscript multiomics-engine/tests/bioconductor_mixed_truth_reference.R
      - name: Upload reference calibration summary and per-seed results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bioconductor-null-and-mixed-truth-calibration
          path: validation-artifacts/*
          if-no-files-found: warn
