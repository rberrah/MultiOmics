name: Multi-omics DIABLO leakage-free holdout reference

on:
  pull_request:
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation_benchmarks.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/tests/test_diablo_holdout_recipe.R'
      - 'multiomics-engine/tests/test_mofa_preflight_signature_stability.R'
      - 'multiomics-engine/tests/test_diablo_outer_reference.R'
      - '.github/workflows/multiomics-diablo-holdout.yml'
      - 'src/routes/multiomics/tool/+page.svelte'
  push:
    branches: [main]
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation_benchmarks.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/tests/test_diablo_holdout_recipe.R'
      - 'multiomics-engine/tests/test_mofa_preflight_signature_stability.R'
      - 'multiomics-engine/tests/test_diablo_outer_reference.R'
      - '.github/workflows/multiomics-diablo-holdout.yml'
  schedule:
    - cron: '11 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-only-preprocessing:
    name: DIABLO independent holdout fold-safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Verify training-only preprocessing and leakage negative controls
        run: Rscript multiomics-engine/tests/test_diablo_holdout_recipe.R
      - name: Verify MOFA2 shared-subject preflight and stability statistics
        run: Rscript multiomics-engine/tests/test_mofa_preflight_signature_stability.R

  real-mixomics:
    name: Real mixOmics::block.splsda heldout tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: train-only-preprocessing
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install required GLPK runtime for igraph and mixOmics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglpk40
      - name: Install and verify reference mixOmics
        run: |
          Rscript -e 'install.packages("BiocManager"); BiocManager::install("mixOmics", ask=FALSE, update=FALSE); stopifnot(requireNamespace("mixOmics", quietly=TRUE)); cat("mixOmics ", as.character(packageVersion("mixOmics")), " installed and loadable\\n")'
      - name: Run heldout known-signal and shuffled-outcome checks on actual DIABLO
        run: Rscript multiomics-engine/tests/test_diablo_outer_reference.R
