name: MultiOmics P0 DESeq2 oracle dispersion attribution

on:
  pull_request:
    paths:
      - 'multiomics-engine/validation/rnaseq_deseq2_oracle_dispersion.R'
      - 'docs/multiomics/RNASEQ_DISPERSION_ORACLE_PROTOCOL.md'
      - '.github/workflows/multiomics-oracle-dispersion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-null-reference:
    name: True NB dispersions versus fitted dispersions and normal/t Wald, 2 designs x 40
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PMX_RNASEQ_DISPERSION_ORACLE_REPS: '40'
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bioc::DESeq2
            any::jsonlite
      - name: Run genuine DESeq2 fixed-truth variance diagnostic
        run: |
          Rscript multiomics-engine/validation/rnaseq_deseq2_oracle_dispersion.R \
            tmp/multiomics-dispersion-oracle
      - name: Preserve all statistical outputs and adverse failed fits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiomics-deseq2-oracle-dispersion-diagnostics
          path: tmp/multiomics-dispersion-oracle/
          if-no-files-found: warn
          retention-days: 90
