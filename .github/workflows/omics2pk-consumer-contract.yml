name: Omics2PK consumer contract - native MultiOmics synthetic ZIP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: multiomics
      - uses: actions/checkout@v7
        with:
          repository: rberrah/Omics2PK
          ref: a4d04bd7acb755d5ea8d38e57612f2b1f908e770
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Produce actual native MultiOmics research ZIP from bundled synthetic demos
        run: |
          mkdir -p consumer/upstream
          ln -s "$GITHUB_WORKSPACE/multiomics" consumer/upstream/multiomics
          node consumer/scripts/build_native_multiomics_research_zip.mjs "$RUNNER_TEMP/omics.zip"
          mkdir -p "$RUNNER_TEMP/unpacked"
          python3 -m zipfile -e "$RUNNER_TEMP/omics.zip" "$RUNNER_TEMP/unpacked"
      - name: Validate exported ZIP against pinned independent Omics2PK consumer
        env:
          PYTHONPATH: ${{ github.workspace }}/consumer/src
        run: |
          python3 multiomics/scripts/validate_multiomics_exchange.py "$RUNNER_TEMP/unpacked/exchange"
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path
          from omics2pk.exchange import inspect_exchange, ExchangeError, prepare_sweet
          from omics2pk.multiomics_pk_readiness import inspect_pk_readiness
          p=Path(os.environ['RUNNER_TEMP'])/'unpacked'/'exchange'
          report=inspect_exchange(p)
          pk=inspect_pk_readiness(p)
          assert (report['subjects'],report['assays'])==(8,49),report
          assert set(report['matrices'])=={'transcriptomics','proteomics','metabolomics'}
          with (p/'samples.csv').open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==49
          assert {x['timepoint'] for x in rows}=={'T0','T12'}
          assert all(not x['collection_time'] and not x['collection_time_unit'] for x in rows)
          assert sum(bool(x['technical_replicate_id']) for x in rows)>=1
          assert len({x['sample_id'] for x in rows})==16
          assert pk['has_categorical_timepoint_column'] is True
          assert pk['temporal_numeric_metadata_ready'] is False
          assert pk['n_omic_assays_missing_collection_time']==49
          assert pk['n_extra_technical_repeat_assays_not_independent_biology']==1
          assert 'PRESERVE_CATEGORICAL_TIMEPOINT_FROM_ORIGINAL_MULTIOMICS_SOURCE' not in pk['missing_for_E3_and_E4']
          try:
              prepare_sweet(p,p.parent/'forbidden-sweet')
          except ExchangeError as err:
              assert 'normalized/transformed' in str(err)
          else:
              raise AssertionError('Raw RNA counts must never be treated as normalized SWEET inputs')
          assert not (p.parent/'forbidden-sweet').exists()
          print('PASS: original ZIP -> Omics2PK reader, exact T0/T12, sample cardinality, no invented PK or SWEET claims')
          PY
      - name: Validate mapped and transposed site input against pinned Omics2PK
        env:
          PYTHONPATH: ${{ github.workspace }}/consumer/src
        run: |
          node multiomics/scripts/build_mapped_exchange_fixture.mjs "$RUNNER_TEMP/mapped-exchange"
          python3 multiomics/scripts/validate_multiomics_exchange.py "$RUNNER_TEMP/mapped-exchange"
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path
          from omics2pk.exchange import inspect_exchange
          from omics2pk.multiomics_pk_readiness import inspect_pk_readiness
          p=Path(os.environ['RUNNER_TEMP'])/'mapped-exchange'
          report=inspect_exchange(p)
          pk=inspect_pk_readiness(p)
          manifest=json.loads((p/'manifest.json').read_text())
          declared=manifest['validation']['downstream_pk_readiness']
          assert declared['status']=='source_exchange_only_not_pk_ready'
          assert declared['structural_exchange_valid'] is True
          assert declared['pk_temporal_numeric_compatible'] is True
          assert declared['shared_molecular_pk_time_origin_verified'] is False
          assert declared['clinical_or_pk_effect_validated'] is False
          assert report['subjects']==2 and report['assays']==2, report
          assert set(report['matrices'])=={'transcriptomics'}, report
          with (p/'samples.csv').open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert [r['collection_time'] for r in rows]==['0','12']
          assert all(r['collection_time_unit']=='h' for r in rows)
          assert all(r['time_origin']=='first_dose' for r in rows)
          assert pk['temporal_numeric_metadata_ready'] is True
          assert pk['has_original_PK_dose_concentration_history'] is False
          assert 'SUBJECT_MATCHED_ORIGINAL_PK_DOSE_CONCENTRATION_EVENTS' in pk['missing_for_E3_and_E4']
          matrix=(p/'matrices'/'transcriptomics.csv').read_text()
          assert 'feature_id,A10,A11' in matrix
          assert 'ENSG_B,NA,15' in matrix
          print('PASS: mapped TSV + transposed matrix -> canonical exchange -> current Omics2PK reader; temporal metadata ready, PK still absent')
          PY
      - name: Validate optional real-assay signature schema against pinned Omics2PK
        env:
          PYTHONPATH: ${{ github.workspace }}/consumer/src
        run: |
          node multiomics/scripts/test_multiomics_individual_signatures.mjs "$RUNNER_TEMP/individual"
          python3 multiomics/scripts/validate_multiomics_exchange.py "$RUNNER_TEMP/individual"
          python3 - <<'PY'
          import csv,os
          from pathlib import Path
          from omics2pk.exchange import inspect_exchange
          from omics2pk.omic_signature_contract import qualify_individual_signatures
          directory=Path(os.environ['RUNNER_TEMP'])/'individual'
          report=inspect_exchange(directory)
          with (directory/'individual_signatures.csv').open(newline='',encoding='utf8') as f:
              rows=list(csv.DictReader(f))
          qualified=qualify_individual_signatures(rows)
          assert report['subjects']==2
          assert qualified['status']=='QUALIFIED_INDIVIDUAL_SIGNATURE_SCHEMA_NOT_PREDICTIVE_EFFECT'
          assert qualified['n_assay_signature_rows']==2
          assert qualified['n_unique_independent_biological_subjects_at_most']==2
          assert not qualified['no_patient_or_score_values_exported'] is False
          print('PASS: original MultiOmics per-assay export parsed by independent Omics2PK schema contract')
          PY
