name: Isolated Kit3 browser failure diagnosis

on:
  push:
    branches: [migration/sveltekit3-candidate-20261017]
    paths:
      - tests/e2e/multiomics-kit3-diagnostics.spec.js
      - .github/workflows/kit3-browser-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - name: Diagnose real browser hydration before any release
        env:
          LABS_E2E_PREBUILT: '1'
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-kit3-diagnostics.spec.js --workers=1 --retries=0
