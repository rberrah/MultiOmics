name: Research v1 external real-data longitudinal and survival qualification

on:
  pull_request:
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation/external_nki_survival_research_v1.R'
      - 'multiomics-engine/validation/external_gse191328_longitudinal_research_v1.R'
      - '.github/workflows/external-time-survival-research-v1.yml'
      - 'docs/multiomics/EXTERNAL_TIME_SURVIVAL_RESEARCH_V1.md'
  push:
    branches: [main]
    paths:
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation/external_nki_survival_research_v1.R'
      - 'multiomics-engine/validation/external_gse191328_longitudinal_research_v1.R'
      - '.github/workflows/external-time-survival-research-v1.yml'
      - 'docs/multiomics/EXTERNAL_TIME_SURVIVAL_RESEARCH_V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-survival-nki:
    name: Public NKI DMFS Cox wrapper-vs-direct qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v7
      - name: Install fixed real-data survival dependencies
        run: |
          Rscript -e 'BiocManager::install(c("Biobase","breastCancerNKI"),version="3.22",ask=FALSE,update=FALSE,quiet=TRUE); install.packages(c("jsonlite","digest","survival")); stopifnot(requireNamespace("breastCancerNKI",quietly=TRUE))'
      - name: Execute public NKI DMFS external qualification
        run: Rscript multiomics-engine/validation/external_nki_survival_research_v1.R
      - name: Preserve compact real-data evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Research-v1-external-NKI-survival
          path: |
            tmp/external-survival-nki/external_survival_nki_evidence.json
            tmp/external-survival-nki/prespecified_feature_family.csv
            tmp/external-survival-nki/dmfs_metadata_used.csv
            tmp/external-survival-nki/independent_direct_coxph.csv
            tmp/external-survival-nki/wrapper/cox_results.csv
            tmp/external-survival-nki/sessionInfo.txt
          if-no-files-found: error
          retention-days: 90

  external-longitudinal-gse191328:
    name: Public GSE191328 remission-by-time lmer wrapper-vs-direct qualification
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v7
      - name: Install fixed public longitudinal dependencies
        run: |
          Rscript -e 'BiocManager::install(c("GEOquery","Biobase","edgeR"),version="3.22",ask=FALSE,update=FALSE,quiet=TRUE); install.packages(c("jsonlite","digest","lme4","lmerTest")); stopifnot(requireNamespace("GEOquery",quietly=TRUE),requireNamespace("lmerTest",quietly=TRUE))'
      - name: Execute GSE191328 external longitudinal qualification
        run: Rscript multiomics-engine/validation/external_gse191328_longitudinal_research_v1.R
      - name: Delete downloaded individual count files before artifact upload
        if: always()
        run: rm -rf tmp/external-longitudinal-gse191328/downloaded-counts
      - name: Preserve compact source hashes and numerical evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Research-v1-external-GSE191328-longitudinal
          path: |
            tmp/external-longitudinal-gse191328/external_longitudinal_gse191328_evidence.json
            tmp/external-longitudinal-gse191328/prespecified_feature_family.csv
            tmp/external-longitudinal-gse191328/longitudinal_metadata_used.csv
            tmp/external-longitudinal-gse191328/source_count_file_manifest.csv
            tmp/external-longitudinal-gse191328/independent_direct_lmertest.csv
            tmp/external-longitudinal-gse191328/wrapper/lmer_results.csv
            tmp/external-longitudinal-gse191328/sessionInfo.txt
          if-no-files-found: error
          retention-days: 90
