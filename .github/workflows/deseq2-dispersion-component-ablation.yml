name: Native DESeq2 gene-wise, trend, MAP and true dispersion component ablation

on:
  pull_request:
    paths:
      - 'multiomics-engine/rnaseq_deseq2_dispersion_component_metrics.R'
      - 'multiomics-engine/tests/test_rnaseq_deseq2_dispersion_component_metrics.R'
      - 'multiomics-engine/validation/rnaseq_deseq2_dispersion_components.R'
      - '.github/workflows/deseq2-dispersion-component-ablation.yml'
  push:
    branches: [main]
    paths:
      - 'multiomics-engine/rnaseq_deseq2_dispersion_component_metrics.R'
      - 'multiomics-engine/tests/test_rnaseq_deseq2_dispersion_component_metrics.R'
      - 'multiomics-engine/validation/rnaseq_deseq2_dispersion_components.R'
      - '.github/workflows/deseq2-dispersion-component-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-four-component-wald:
    name: Real 384-fit paired NB null gene-wise/trend/MAP/true alpha Wald diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 125
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v7
      - name: Preflight R syntax and 12 paired whole-study scientific cells
        shell: bash
        run: |
          Rscript -e 'for(f in c(
            "multiomics-engine/rnaseq_deseq2_dispersion_component_metrics.R",
            "multiomics-engine/tests/test_rnaseq_deseq2_dispersion_component_metrics.R",
            "multiomics-engine/validation/rnaseq_deseq2_dispersion_components.R"
          ))parse(file=f);cat("All native component study scripts parse PASS\\n")'
          Rscript multiomics-engine/tests/test_rnaseq_deseq2_dispersion_component_metrics.R
      - name: Install actual R 4.5.2 Bioc 3.22 native reference package stack
        shell: bash
        run: |
          Rscript -e '
            stopifnot(identical(as.character(getRversion()),"4.5.2"),
                      identical(as.character(BiocManager::version()),"3.22"))
            cran<-c("jsonlite","statmod","plumber","knitr","rmarkdown")
            need<-cran[!vapply(cran,requireNamespace,logical(1),quietly=TRUE)]
            if(length(need))install.packages(need,repos="https://cloud.r-project.org")
            bioc<-c("DESeq2","edgeR","limma","airway")
            need<-bioc[!vapply(bioc,requireNamespace,logical(1),quietly=TRUE)]
            if(length(need))BiocManager::install(need,ask=FALSE,update=FALSE,quiet=TRUE)
            stopifnot(all(vapply(c(cran,bioc),requireNamespace,
                                 logical(1),quietly=TRUE)))
          '
      - name: Verify frozen native 171-package reference environment
        run: Rscript multiomics-engine/environment/check_reference_runtime.R verify
      - name: Run 384 genuine native Wald models and audit all BH q-values
        run: |
          Rscript multiomics-engine/validation/rnaseq_deseq2_dispersion_components.R \
            tmp/deseq2-dispersion-four-component-evidence
      - name: Preserve original per-study findings, including scientific negatives
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MultiOmics-true-DESeq2-four-dispersion-components-${{ github.sha }}
          path: |
            tmp/reference-runtime/
            tmp/deseq2-dispersion-four-component-evidence/
          if-no-files-found: warn
          retention-days: 90
