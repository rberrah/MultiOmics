name: Independent external GEO GSE22871 source qualification

on:
  pull_request:
    paths:
      - '.github/workflows/geo-gse22871-external-validation.yml'
      - 'scripts/qualify_geo_gse22871.py'
      - 'scripts/qualify_gpl1261_annotation.py'
      - 'multiomics-engine/tests/test_geo_gpl1261_mouse4302_concordance.R'
      - 'scripts/qualify_gpl1261_entrez_concordance.py'
      - 'scripts/qualify_geo_native_probe_evidence.py'
      - 'multiomics-engine/tests/test_geo_native_probe_replay.R'
      - 'docs/multiomics/GSE22871_EXTERNAL_VALIDATION_PROTOCOL.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-external-cohort:
    name: Actual GEO GSE22871 independent 30-mouse original processed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject invented metadata, wrong platform, missing subjects, and nonfinite expression
        run: python3 scripts/qualify_geo_gse22871.py --self-test
      - name: Download GEO original independent cohort and validate all its biological samples and probe rows
        run: |
          python3 scripts/qualify_geo_gse22871.py tmp/multiomics/real-external-GSE22871
      - name: Reject first-hit mapping of multi-gene probes and malformed annotation tables
        run: python3 scripts/qualify_gpl1261_annotation.py --self-test
      - name: Qualify genuine NCBI GPL1261 platform annotation and all 45,101 matrix probe identities
        run: |
          python3 scripts/qualify_gpl1261_annotation.py tmp/multiomics/real-external-GSE22871
      - name: Refuse external signature scores without pinned annotation and cross-platform calibration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('tmp/multiomics/real-external-GSE22871')
          r=json.loads((root/'GPL1261_annotation_mapping_audit.json').read_text())
          assert r['matrix_probe_ids_with_official_row'] >= 35000
          assert r['official_annotation_rows'] >= 30000
          assert r['external_cohort_source_sha256']=='630706c5d3778068a9e08af01ce315b4886de17abefbfaae32708e7ed3d2d861'
          assert len(r['official_annotation_gzip_sha256'])==64
          assert r['cross_platform_score_projection']=='BLOCKED_SCALE_AND_PROBE_COLLAPSE_NOT_VALIDATED'
          assert r['per_animal_scores_generated']==0
          for name in ['GPL1261_probe_to_gene_all.csv','GPL1261_gene_to_probe_multiplicity.csv',
                       'GPL1261_unmapped_probe_ids.csv','GPL1261_unmapped_symbol_ids.csv',
                       'GPL1261_ambiguous_probe_ids.csv']:
            assert (root/name).is_file(), 'Missing explicit ambiguity audit: '+name
          print('PASS: 45k-probe source-annotated crosswalk audited, no external biological scores claimed')
          PY
      - name: Assert real external-cohort evidence and explicitly blocked unqualified cross-platform scores
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tmp/multiomics/real-external-GSE22871/external_geo_intake_audit.json')
          r=json.loads(p.read_text())
          assert r['n_biological_subjects']==30
          assert r['n_processed_affymetrix_probe_ids']>=40000
          assert r['platform_id']=='GPL1261'
          assert len(r['genotype_dose_groups'])==6
          assert all(z['n']==5 for z in r['genotype_dose_groups'])
          assert r['projection']['status']=='BLOCKED_UNTIL_ANNOTATION_AND_SCALE_BRIDGE'
          assert r['projection']['score_rows_exported']==0
          assert r['analysis_status']=='intake_qualified_external_projection_blocked'
          print('PASS: independent biological source admitted; unverified cross-platform model projection BLOCKED')
          PY
      - name: Archive source bytes and all original dataset checksums, including unfavorable or blocked outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: external-GSE22871-authentic-probe-level-GEO-metadata-no-PK-claims
          path: tmp/multiomics/real-external-GSE22871/
          if-no-files-found: warn

  independent-bioc-probe-concordance:
    name: Genuine mouse4302.db/AnnotationDbi independent concordance against full GEO GPL1261
    runs-on: ubuntu-latest
    needs: authentic-external-cohort
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Download exact genuine GPL1261 and 30-mouse source from preceding job
        uses: actions/download-artifact@v6
        with:
          name: external-GSE22871-authentic-probe-level-GEO-metadata-no-PK-claims
          path: tmp/multiomics/real-external-GSE22871
      - name: Verify pinned R 4.5.2 and Bioconductor 3.22
        run: |
          Rscript -e 'stopifnot(identical(as.character(getRversion()),"4.5.2"),requireNamespace("BiocManager",quietly=TRUE),identical(as.character(BiocManager::version()),"3.22"))'
      - name: Install original Bioconductor mouse4302.db annotation and reference packages
        run: |
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org"); BiocManager::install(c("mouse4302.db","AnnotationDbi"),version="3.22",ask=FALSE,update=FALSE); stopifnot(requireNamespace("mouse4302.db",quietly=TRUE),requireNamespace("AnnotationDbi",quietly=TRUE),requireNamespace("org.Mm.eg.db",quietly=TRUE),identical(as.character(packageVersion("mouse4302.db")),"3.13.0"))'
      - name: Test independent annotation agreement/disagreement and ambiguous symbol retention
        run: |
          Rscript multiomics-engine/tests/test_geo_gpl1261_mouse4302_concordance.R --self-test
      - name: Compare all 45,101 original GEO probe mappings with genuine mouse4302.db without replacing discrepancies
        run: |
          Rscript multiomics-engine/tests/test_geo_gpl1261_mouse4302_concordance.R \
            tmp/multiomics/real-external-GSE22871 \
            tmp/multiomics/real-external-GSE22871/independent-bioc-concordance
      - name: Require comprehensive real independent reference audit and zero invented external scores
        run: |
          Rscript -e 'library(jsonlite); a<-fromJSON("tmp/multiomics/real-external-GSE22871/independent-bioc-concordance/GPL1261_mouse4302_db_concordance_audit.json");stopifnot(a$probes_compared==45101,a$score_rows_generated==0,a$cross_platform_projection=="BLOCKED_UNTIL_ANNOTATION_CONSENSUS_AND_SCALE_TRANSFER",sum(unlist(a$statuses))==45101);cat("PASS: 45,101 real probes audited against true mouse4302.db; 0 projected biological signatures\n")'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fail-closed identifier parser and all seven stable-ID concordance cases
        run: |
          python3 scripts/qualify_gpl1261_entrez_concordance.py --self-test
      - name: Audit historical official NCBI Entrez Gene ID vs independent Bioconductor Entrez IDs on 45,101 probes
        run: |
          python3 scripts/qualify_gpl1261_entrez_concordance.py \
            tmp/multiomics/real-external-GSE22871 \
            tmp/multiomics/real-external-GSE22871/independent-bioc-concordance
      - name: Enforce no gene projection or phenotype use; retain all numeric and unparseable ID disagreements
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tmp/multiomics/real-external-GSE22871/independent-bioc-concordance/original_NCBI_vs_Bioc_Entrez_ID')
          d=json.loads((p/'GPL1261_entrez_id_concordance_audit.json').read_text())
          assert d['source_probe_measurements']==45101
          assert sum(d['entrez_concordance_counts'].values())==45101
          assert d['external_scores_produced']==0
          assert d['all_id_compared_without_outcome_labels']
          assert d['status']=='STABLE_ENTREZ_ID_COMPARISON_ONLY_EXTERNAL_PROJECTION_BLOCKED'
          assert len(d['source_original_gpl1261_sha256'])==64
          assert len(d['source_original_geo_series_sha256'])==64
          for n in ['GPL1261_all_probe_entrez_concordance.csv',
                    'GPL1261_entrez_disagreements_all.csv',
                    'Cyp3a11_entrez_candidate_reference.csv']:
            assert (p/n).is_file(), n
          print('PASS: original NCBI versus independent Bioconductor stable IDs audited without invented external scores')
          PY
      - name: Predeclared genuine external Cyp3a11 native probe measurements (never projected model scores)
        run: |
          python3 scripts/qualify_geo_native_probe_evidence.py --self-test
          python3 scripts/qualify_geo_native_probe_evidence.py \
            tmp/multiomics/real-external-GSE22871 \
            tmp/multiomics/real-external-GSE22871/independent-bioc-concordance
      - name: Independent real RMA-probe numeric replay against all 45,101 original rows
        run: |
          Rscript multiomics-engine/tests/test_geo_native_probe_replay.R --self-test
          Rscript multiomics-engine/tests/test_geo_native_probe_replay.R \
            tmp/multiomics/real-external-GSE22871 \
            tmp/multiomics/real-external-GSE22871/independent-bioc-concordance
      - name: Assert true native measurements without silently relabelling any score as validated
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('tmp/multiomics/real-external-GSE22871/independent-bioc-concordance/native_external_probe_observations')
          audit=json.loads((d/'external_native_measurement_audit.json').read_text())
          obs=list(csv.DictReader((d/'native_Cyp3a11_probe_measurements_not_model_scores.csv').open()))
          assert audit['n_independent_mice']==30 and audit['n_original_measured_probes']==45101
          assert len(obs)==30*audit['n_anchor_candidates']
          assert len({x['assay_id'] for x in obs})==30
          assert not audit['nutrimouse_frozen_model_applied']
          assert not audit['selection_used_dose_or_genotype']
          assert audit['external_biological_signature_scores_exported']==0
          assert all(x['cross_platform_model_score']=='NOT_COMPUTED' for x in obs)
          assert (d/'independent_R_replay.txt').is_file()
          print('PASS: measured independent external expression only, no PK/biological score claim')
          PY
      - name: Preserve genuine concordance, source discrepancies, candidate gene mappings and blocked claim
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: independent-Bioconductor-mouse4302-GPL1261-probe-gene-disagreements
          path: tmp/multiomics/real-external-GSE22871/independent-bioc-concordance/
          if-no-files-found: warn
