name: Remediate npm advisories and validate lockfile
on:
  push:
    branches:
      - fix/npm-audit-14-advisories-20261016
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.repository == 'rberrah/MultiOmics'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile after removing unused vulnerable packages
        run: npm install --package-lock-only --no-fund --ignore-scripts
      - name: Baseline audit against the exact committed lockfile
        run: |
          node --version
          npm --version
          npm ci
          npm audit --json > npm-audit-before.json || true
          node -e "let a=require('./npm-audit-before.json'); console.log('Baseline vulnerabilities:',JSON.stringify(a.metadata?.vulnerabilities||{}));"
      - name: Apply compatible npm fixes without forcing major upgrades
        run: |
          npm audit fix --package-lock-only --no-fund || true
          npm ci
      - name: Check SvelteKit, contract tests and distributable build
        run: |
          npm run check
          npm run test:multiomics
          npm run build
          npm run test:migration
      - name: Record exact residual advisories
        run: |
          npm audit --json > npm-audit-after.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('npm-audit-after.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log('Residual vulnerabilities:',JSON.stringify(v));
          for(const [name,data] of Object.entries(a.vulnerabilities||{})){
            console.log(name, data.severity,JSON.stringify(data.range), 'fixAvailable=',JSON.stringify(data.fixAvailable));
          }
          NODE
      - name: Push safely fixed and tested package manifest/lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible npm lockfile changes found"
          else
            git commit -m "fix(deps): apply tested nonbreaking npm audit remediations"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Attach before/after security evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-evidence
          path: npm-audit-*.json
          if-no-files-found: warn
      - name: Reject unresolved high or critical advisories
        run: npm audit --audit-level=moderate
