name: MultiOmics standalone software qualification

on:
  push:
    branches: [main, 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-browser:
    name: Standalone SvelteKit, JS reference and beginner browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install from independent lockfile
        run: npm ci
      - name: Fail CI on any npm advisory including low severity (Kit3 zero advisory gate)
        run: npm audit --audit-level=low
      - name: Check standalone imports and Svelte interfaces
        run: npm run check
      - name: Exercise real deterministic JS and method guardrails
        run: npm run test:multiomics
      - name: Reject forged MOFA2 Python environment evidence (10 negative controls)
        run: python3 scripts/test_mofa_python_lock.py
      - name: Build app with no PMx portal
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run standalone FR/EN lessons and four-button desktop UI
        env:
          LABS_E2E_PREBUILT: '1'
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-methods-learning.spec.js tests/e2e/multiomics-contrast.spec.js tests/e2e/multiomics-shell.spec.js tests/e2e/multiomics-hydration.spec.js tests/e2e/multiomics-single-omic.spec.js tests/e2e/multiomics-beginner-clarity.spec.js tests/e2e/multiomics-provenance.spec.js tests/e2e/multiomics-scientific-summary-safety.spec.js tests/e2e/multiomics-r-health-preflight.spec.js tests/e2e/multiomics-confirmatory-native-gate.spec.js --workers=1 --retries=0
      - name: Create portable web download with manifest; Node-only runtime
        run: |
          node scripts/package_portable_web.mjs
          node scripts/test_portable_web.mjs
          python3 scripts/archive_portable_web.py
      - name: Exercise portable downloaded bundle in real desktop/mobile browser
        run: npx playwright test --config playwright.portable.config.js --workers=1 --retries=0
      - name: Publish independently usable browser package as Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: MultiOmics-portable-web-${{ github.sha }}
          path: |
            release/MultiOmics-portable-web.zip
            release/MultiOmics-portable-web.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Validate static GitHub Pages base path independently of PMx
        env:
          BASE_PATH: /MultiOmics
        run: |
          npm run build
          echo "Generated standalone Pages tree:"
          find build -maxdepth 8 -type f \( -name '*.html' -o -name '*.json' \) -print | sort | head -100
          echo "SvelteKit generated route manifest:"
          find .svelte-kit/output -maxdepth 7 -type f -name '*page*' -print | head -45
          for required in \
            build/index.html \
            build/multiomics/index.html \
            build/multiomics/tool/index.html \
            build/multiomics/learn/index.html \
            build/multiomics/disciplines/index.html \
            build/multiomics/resources/index.html
          do
            if [[ ! -s "$required" ]]; then
              echo "::error::Missing prerendered standalone page $required"
              exit 1
            fi
          done
          node <<'NODE'
          const fs = require('fs');
          const root = fs.readFileSync('build/index.html', 'utf8');
          const disciplines = fs.readFileSync('build/multiomics/disciplines/index.html', 'utf8');
          const automaticPmxRedirect =
            /http-equiv=["']refresh["'][^>]*rberrah\.github\.io\/pharmacometrie/i.test(root) ||
            /window\.location(?:\.replace|\.assign)?\s*\([^)]*rberrah\.github\.io\/pharmacometrie/i.test(root);
          if (automaticPmxRedirect) {
            console.error('::error::Standalone MultiOmics must not automatically redirect to PMx');
            process.exit(1);
          }
          if (!root.includes('https://rberrah.github.io/')) {
            console.error('::error::Standalone shell must retain a link to the main website');
            process.exit(1);
          }
          if (!disciplines.includes('https://rberrah.github.io/pharmacometrie/')) {
            console.error('::error::Other disciplines must present PMx Explain');
            process.exit(1);
          }
          console.log('PASS: standalone navigation links to the ecosystem without depending on or redirecting to PMx.');
          NODE

  r-contract:
    name: Independent R package-free reference contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Verify native R syntax and repository inputs
        run: |
          Rscript -e 'for(f in c("multiomics-engine/server.R","multiomics-engine/advanced_methods.R","multiomics-engine/run_backend.R","multiomics-engine/run_research_bundle.R","multiomics-engine/verify_research_replay.R","multiomics-engine/plot_research_figures.R","multiomics-engine/reference_inference_audit.R","multiomics-engine/validation/rnaseq_bh_oracle.R","multiomics-engine/tests/test_reference_inference_audit.R","multiomics-engine/tests/bioconductor_null_calibration.R","multiomics-engine/tests/bioconductor_mixed_truth_reference.R")) parse(file=f); cat("R parsing PASS\n")'
      - name: Verify local R onboarding doctor without installing packages
        run: Rscript multiomics-engine/reference_doctor.R --self-test
      - name: Verify independent BH replay rejects invalid R feature/q records
        run: Rscript multiomics-engine/tests/test_reference_inference_audit.R
      - name: Refuse false LC-MS coordinate feature stability and ambiguous matches
        run: |
          Rscript multiomics-engine/tests/test_ms_feature_sensitivity.R
          Rscript -e 'parse(file="multiomics-engine/tests/real_sacurine_zenodo_xcms_parameter_sensitivity.R")'
      - name: Test R backend routes and mandatory safeguards
        run: Rscript multiomics-engine/tests/backend_smoke.R
      - name: Test JS-to-R explanatory reference
        run: Rscript multiomics-engine/tests/browser_reference_agreement.R
      - name: Test confirmatory design, null uncertainty, MS/proteomics and ML negative controls
        run: |
          set -euo pipefail
          for test in \
            test_rnaseq_confirmatory_preflight.R \
            test_null_reference_metrics.R \
            test_mixed_truth_reference_metrics.R \
            test_diablo_holdout_recipe.R \
            test_mofa_truth_metrics.R \
            test_ms_quantitative_assurance.R \
            test_proteomics_quantitative_assurance.R
          do
            Rscript "multiomics-engine/tests/$test"
          done
