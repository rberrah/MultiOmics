name: Independent Gamma-Poisson heterogeneous source DESeq2 dispersion falsification

on:
  pull_request:
    paths:
      - 'multiomics-engine/rnaseq_independent_gamma_poisson_null.R'
      - 'multiomics-engine/tests/test_independent_gamma_poisson_null.R'
      - 'multiomics-engine/rnaseq_independent_gamma_poisson_metrics.R'
      - 'multiomics-engine/tests/test_independent_gamma_poisson_metrics.R'
      - 'multiomics-engine/validation/rnaseq_independent_gamma_poisson_dispersion_components.R'
      - '.github/workflows/independent-gamma-poisson-deseq2.yml'
  push:
    branches: [main]
    paths:
      - 'multiomics-engine/rnaseq_independent_gamma_poisson_metrics.R'
      - 'multiomics-engine/tests/test_independent_gamma_poisson_metrics.R'
      - 'multiomics-engine/validation/rnaseq_independent_gamma_poisson_dispersion_components.R'
      - '.github/workflows/independent-gamma-poisson-deseq2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-gp-heterogeneous-null:
    name: Real 384-fit independent Gamma-Poisson heterogeneous alpha falsification
    runs-on: ubuntu-latest
    timeout-minutes: 125
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    steps:
      - uses: actions/checkout@v5
      - name: Preflight R syntax and 12 new heterogeneous Gamma-Poisson null scientific cells
        shell: bash
        run: |
          Rscript -e 'for(f in c(
            "multiomics-engine/rnaseq_independent_gamma_poisson_metrics.R",
            "multiomics-engine/tests/test_independent_gamma_poisson_metrics.R",
            "multiomics-engine/validation/rnaseq_independent_gamma_poisson_dispersion_components.R"
          ))parse(file=f);cat("All native component study scripts parse PASS\\n")'
          Rscript multiomics-engine/tests/test_independent_gamma_poisson_metrics.R
      - name: Check independent Gamma-Poisson generator has correct NB moments and off-trend alpha
        run: |
          Rscript multiomics-engine/tests/test_independent_gamma_poisson_null.R
      - name: Install actual R 4.5.2 Bioc 3.22 native reference package stack
        shell: bash
        run: |
          Rscript -e '
            stopifnot(identical(as.character(getRversion()),"4.5.2"),
                      identical(as.character(BiocManager::version()),"3.22"))
            cran<-c("jsonlite","statmod","plumber","knitr","rmarkdown")
            need<-cran[!vapply(cran,requireNamespace,logical(1),quietly=TRUE)]
            if(length(need))install.packages(need,repos="https://cloud.r-project.org")
            bioc<-c("DESeq2","edgeR","limma","airway")
            need<-bioc[!vapply(bioc,requireNamespace,logical(1),quietly=TRUE)]
            if(length(need))BiocManager::install(need,ask=FALSE,update=FALSE,quiet=TRUE)
            stopifnot(all(vapply(c(cran,bioc),requireNamespace,
                                 logical(1),quietly=TRUE)))
          '
      - name: Verify frozen native 171-package reference environment
        run: Rscript multiomics-engine/environment/check_reference_runtime.R verify
      - name: Compare 384 native Wald fits on independent off-trend Gamma-Poisson source
        run: |
          Rscript multiomics-engine/validation/rnaseq_independent_gamma_poisson_dispersion_components.R \
            tmp/independent-gamma-poisson-four-component-evidence
      - name: Preserve original per-study findings, including scientific negatives
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MultiOmics-independent-Gamma-Poisson-DESeq2-dispersion-${{ github.sha }}
          path: |
            tmp/reference-runtime/
            tmp/independent-gamma-poisson-four-component-evidence/
          if-no-files-found: warn
          retention-days: 90
