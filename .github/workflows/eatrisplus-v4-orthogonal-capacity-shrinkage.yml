name: EATRIS v4 original n90 orthogonal PC versus Ridge shrinkage tissue-aware benchmark
on:
  pull_request:
    paths:
      - "scripts/benchmark_eatrisplus_v4_orthogonal_capacity_shrinkage.py"
      - "scripts/test_eatrisplus_v4_orthogonal_capacity_shrinkage.py"
      - ".github/workflows/eatrisplus-v4-orthogonal-capacity-shrinkage.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-original-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install scientific source reader and numerics
        run: python -m pip install numpy scipy scikit-learn h5py
      - name: Synthetic strict source, reproducibility and leakage-negative controls
        run: python -m unittest discover -s scripts -p 'test_eatrisplus_v4_orthogonal_capacity_shrinkage.py' -v
      - name: Real original Zenodo v4 MD5 verified 90-person 2 by 2 PC shrinkage experiment
        run: |
          python -m scripts.benchmark_eatrisplus_v4_orthogonal_capacity_shrinkage > /tmp/eatris_orthogonal_real_aggregate.json || { cat /tmp/eatris_orthogonal_real_aggregate.json; exit 2; }
          python - <<'PY'
          import json
          obj=json.load(open("/tmp/eatris_orthogonal_real_aggregate.json"))
          assert obj["status"]=="SOURCE_ORIGINAL_EATRIS_V4_ORTHOGONAL_2BY2_CAPACITY_SHRINKAGE_EXPLORATORY_NOT_PK"
          assert obj["original_matched_unique_persons"]==90
          assert obj["source_original_MD5_verified"]
          assert len(obj["heldout_protein_profile_MAE_by_factorial_arm"])==13
          assert obj["model_setting_chosen_after_previous_original_experiments"]
          assert obj["never_retained_original_participant_IDs_or_values"]
          print(json.dumps(obj,indent=2,sort_keys=True))
          PY
      - if: always()
        run: rm -f /tmp/eatris_orthogonal_real_aggregate.json
