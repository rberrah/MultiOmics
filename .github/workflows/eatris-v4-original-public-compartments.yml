name: EATRIS-Plus v4 original 125-person public MuData tissue-of-origin audit
on:
  pull_request:
    paths:
      - "scripts/audit_eatris_plus_v4_original_h5mu.py"
      - "scripts/test_eatris_plus_v4_original_h5mu.py"
      - ".github/workflows/eatris-v4-original-public-compartments.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Exact published Zenodo record/hash and no individual rows synthetic contract
        run: |
          python -m pip install h5py
          python -m unittest discover -s scripts -p 'test_eatris_plus_v4_original_h5mu.py' -v
      - name: Source official Zenodo MuData 141.7MB SHA-pinned original schema replay
        run: |
          python -m scripts.audit_eatris_plus_v4_original_h5mu > /tmp/eatris_original_schema.json || { cat /tmp/eatris_original_schema.json; exit 2; }
          python - <<'PY'
          import json
          q=json.load(open("/tmp/eatris_original_schema.json"))
          assert q["status"]=="ORIGINAL_EATRIS_PLUS_V4_H5MU_AUTHENTICATED_SCHEMA_ONLY"
          assert q["n_original_modality_groups"]>=3
          assert q["zenodo_record_id"]==19136013
          assert q["original_individual_donor_labels_or_values_emitted"] is False
          print(json.dumps(q,sort_keys=True,indent=2))
          PY
      - if: always()
        run: rm -f /tmp/eatris_original_schema.json
