name: MultiOmics survival native-R qualification

on:
  pull_request:
    paths:
      - 'src/lib/multiomics/**'
      - 'scripts/test_multiomics_cox_reference.mjs'
      - 'multiomics-engine/tests/independent_cox_reference.R'
      - 'multiomics-engine/tests/test_survival_backend.R'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/reference_full_results.R'
      - '.github/workflows/cox-reference.yml'
      - 'release-v1.1-manifest.json'
      - 'docs/multiomics/RELEASE_V1_1_0_20261019.md'
      - 'static/multiomics/ecosystem-graphical-abstract.svg'
      - 'src/routes/multiomics/tool/+page.svelte'
  push:
    branches: [main]
    paths:
      - 'src/lib/multiomics/**'
      - 'scripts/test_multiomics_cox_reference.mjs'
      - 'multiomics-engine/tests/independent_cox_reference.R'
      - 'multiomics-engine/tests/test_survival_backend.R'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/server.R'
      - 'multiomics-engine/reference_full_results.R'
      - '.github/workflows/cox-reference.yml'
      - 'static/multiomics/ecosystem-graphical-abstract.svg'
      - 'src/routes/multiomics/tool/+page.svelte'
  schedule:
    - cron: '19 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cox-reference:
    name: survival::coxph numerical reference, PH diagnostics and refusal controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - run: npm ci
      - name: Install native survival reference dependencies
        run: Rscript -e 'install.packages(c("jsonlite","digest","survival"))'
      - name: Generate independently censored survival studies
        run: node scripts/test_multiomics_cox_reference.mjs --generate tmp/multiomics/cox-reference
      - name: Fit independent R survival Cox and PH diagnostic
        run: |
          Rscript multiomics-engine/tests/independent_cox_reference.R \
            tmp/multiomics/cox-reference/survival-observations.csv \
            tmp/multiomics/cox-reference/browser-cox.csv \
            tmp/multiomics/cox-reference/r-cox.csv
      - name: Compare independent R and browser Breslow estimates
        run: node scripts/test_multiomics_cox_reference.mjs --compare tmp/multiomics/cox-reference
      - name: Validate native Efron survival backend and fail-closed safeguards
        run: Rscript multiomics-engine/tests/test_survival_backend.R
      - name: Archive survival numerical qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-survival-independent-validation
          path: tmp/multiomics/cox-reference/
          if-no-files-found: warn
