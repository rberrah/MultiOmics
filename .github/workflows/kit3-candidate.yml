name: SvelteKit 3 controlled migration candidate (not production)

on:
  push:
    branches: [migration/sveltekit3-candidate-20261017]
    paths:
      - '.github/workflows/kit3-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Apply official migration to disposable branch, preserve evidence and run hard gates
    if: github.ref == 'refs/heads/migration/sveltekit3-candidate-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install current safe pinned production tree
        run: npm ci
      - name: Official automated SvelteKit 3 source transformation
        run: |
          set -euo pipefail
          npx --yes sv migrate sveltekit-3 --tasks all --confirm
      - name: Install minimum supported v3 toolchain without bypassing dependency conflicts
        run: |
          set -euo pipefail
          # Layercake 10 declares TypeScript 5 as a peer and is not imported by
          # any application file (verified by GitHub code search). Remove it
          # from this candidate, rather than overriding npm peer protection.
          npm pkg delete dependencies.layercake
          npm install --save-dev '@sveltejs/kit@^3.1.0' '@sveltejs/vite-plugin-svelte@^7.0.0' \
            'svelte@^5.57.1' 'vite@^8.0.12' 'typescript@^6.0.0' \
            '@sveltejs/adapter-auto@^8.0.0' '@types/node@^24.0.0'
          npm install --save '@sveltejs/adapter-static@^4.0.0'
          npm pkg set 'engines.node=>=22.17.0'
          npm ci
      - name: Assert official syntax and preserve MultiOmics provenance contract
        run: |
          set -euo pipefail
          test ! -f svelte.config.js
          grep -q 'VITE_MULTIOMICS_SOURCE_SHA' vite.config.js
          grep -q '"#lib' package.json
          if grep -R --include='*.js' --include='*.svelte' --include='*.ts' \
            -n "from '\$app/stores'\|from \"\$app/stores\"" src; then
            echo "::error::Kit3 removed legacy \$app/stores"; exit 1
          fi
          # sv codemod rewrites blocks containing historic trailing spaces;
          # normalize these only in migrated code, then insist on a clean diff.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\\0')
          for name in files:
              if not name or Path(name).suffix not in ('.svelte','.js','.ts'): continue
              p=Path(name)
              if not p.exists(): continue
              value=p.read_text()
              cleaned='\\n'.join(x.rstrip(' \\t') for x in value.split('\\n'))
              if cleaned!=value:
                  p.write_text(cleaned)
          PY
          git diff --check
      - name: Save migration candidate in dedicated branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration differences"; exit 1
          fi
          git commit -m "Automated SvelteKit 3 source migration candidate [skip ci]"
          git push origin HEAD:migration/sveltekit3-candidate-20261017
          echo "PROPOSED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Strict dependency and TypeScript/SvelteKit validation (no suppressions)
        run: |
          set -euo pipefail
          npm audit --audit-level=low
          npm run check
          npm run test:multiomics
          npm run build
      - name: Publish audited candidate metadata even on failure
        if: always()
        run: |
          {
            echo "Repository: rberrah/MultiOmics"
            echo "Isolated branch: migration/sveltekit3-candidate-20261017"
            echo "Candidate SHA: ${PROPOSED_SHA:-not-saved}"
            echo "No release unless full checks + CI + route overlays PASS"
            git status --short
            git log -1 --format='%H %s'
          } > kit3_candidate_status.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: multiomics-kit3-isolated-migration-status
          path: kit3_candidate_status.txt
          if-no-files-found: warn
