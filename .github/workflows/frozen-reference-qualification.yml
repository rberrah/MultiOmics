name: Frozen R reference — calibration and negative-control qualification

on:
  pull_request:
    paths:
      - 'multiomics-engine/environment/**'
      - 'multiomics-engine/tests/bioconductor_null_calibration.R'
      - 'multiomics-engine/tests/bioconductor_mixed_truth_reference.R'
      - 'multiomics-engine/reference_inference_audit.R'
      - 'multiomics-engine/tests/test_reference_inference_audit.R'
      - 'multiomics-engine/validation/rnaseq_bh_oracle.R'
      - '.github/workflows/frozen-reference-qualification.yml'
  # The release assembler requires an independently reproducible passing
  # scientific result on the *exact* immutable published SHA, even when a
  # commit changes only JS/UI/other methods. Path-filtered main pushes gave
  # a permanently stale source pin and prevented visible header updates.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-reference:
    name: Pinned R/Bioconductor, global null and planted truth
    runs-on: ubuntu-latest
    timeout-minutes: 85
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    env:
      MULTIOMICS_NULL_REPLICATES: '8'
      MULTIOMICS_NULL_STRESS_REPLICATES: '8'
      MULTIOMICS_MIXED_REFERENCE_REPLICATES: '8'
      MULTIOMICS_VALIDATION_OUTPUT: tmp/reference-methods
    steps:
      - uses: actions/checkout@v7
      - name: Parse all native BH audit scripts before costly R installation
        run: |
          Rscript -e 'for(f in c(
            "multiomics-engine/reference_inference_audit.R",
            "multiomics-engine/validation/rnaseq_bh_oracle.R",
            "multiomics-engine/tests/test_reference_inference_audit.R",
            "multiomics-engine/tests/bioconductor_null_calibration.R",
            "multiomics-engine/tests/bioconductor_mixed_truth_reference.R"
          )) parse(file=f); cat("R inference audit syntax PASS\\n")'
      - name: Restore exact frozen R package closure
        shell: bash
        env:
          MULTIOMICS_CRAN_SNAPSHOT: '2026-10-16'
        run: |
          Rscript - <<'RSCRIPT'
          snapshot <- Sys.getenv("MULTIOMICS_CRAN_SNAPSHOT")
          cran <- paste0("https://p3m.dev/cran/", snapshot)
          options(repos=c(CRAN=cran))
          if(!requireNamespace("BiocManager",quietly=TRUE))
            install.packages("BiocManager",repos=cran)
          stopifnot(identical(as.character(getRversion()),"4.5.2"))
          stopifnot(identical(as.character(BiocManager::version()),"3.22"))

          required_cran <- c("jsonlite","statmod","plumber","knitr","rmarkdown","digest")
          missing <- required_cran[!vapply(required_cran,requireNamespace,logical(1),quietly=TRUE)]
          if(length(missing)) install.packages(missing,repos=cran)

          # Resolve the Bioconductor 3.22 dependency graph first. We then
          # restore every locked Bioconductor package that differs from the
          # measured 2026-10-16 inventory from an explicit versioned source
          # tarball. The final full-library SHA check remains authoritative.
          required_bioc <- c("DESeq2","edgeR","limma","airway")
          missing <- required_bioc[!vapply(required_bioc,requireNamespace,logical(1),quietly=TRUE)]
          if(length(missing))
            BiocManager::install(missing,version="3.22",ask=FALSE,update=FALSE,quiet=TRUE)

          frozen <- jsonlite::fromJSON(
            "multiomics-engine/environment/reference-runtime-inventory.json",
            simplifyVector=TRUE
          )
          expected <- unlist(frozen$packages,use.names=TRUE)
          bioc_repo <- c(
            Biobase="bioc", BiocGenerics="bioc", BiocParallel="bioc",
            BiocVersion="bioc", DESeq2="bioc", DelayedArray="bioc",
            GenomicRanges="bioc", IRanges="bioc", MatrixGenerics="bioc",
            S4Arrays="bioc", S4Vectors="bioc", Seqinfo="bioc",
            SparseArray="bioc", SummarizedExperiment="bioc", XVector="bioc",
            edgeR="bioc", limma="bioc", preprocessCore="bioc",
            airway="data/experiment"
          )
          restore_one <- function(pkg, repo_kind) {
            want <- unname(expected[[pkg]])
            have <- if(requireNamespace(pkg,quietly=TRUE))
              as.character(utils::packageVersion(pkg)) else NA_character_
            if(identical(have,want)) return(invisible(FALSE))
            filename <- paste0(pkg,"_",want,".tar.gz")
            root <- paste0("https://bioconductor.org/packages/3.22/",
                           repo_kind,"/src/contrib/")
            urls <- c(
              paste0(root,filename),
              paste0(root,"Archive/",pkg,"/",filename)
            )
            dest <- file.path(tempdir(),filename)
            ok <- FALSE
            for(url in urls) {
              try_result <- try(utils::download.file(
                url,dest,mode="wb",quiet=TRUE
              ),silent=TRUE)
              if(!inherits(try_result,"try-error") &&
                 file.exists(dest) && file.info(dest)$size > 1000) {
                ok <- TRUE
                message("Restoring ",pkg," ",want," from ",url)
                break
              }
              unlink(dest)
            }
            if(!ok) stop("Unable to retrieve locked Bioconductor tarball for ",
                         pkg," ",want)
            install.packages(dest,repos=NULL,type="source")
            observed <- as.character(utils::packageVersion(pkg))
            if(!identical(observed,want))
              stop("Version restore failed for ",pkg,": ",observed," != ",want)
            invisible(TRUE)
          }
          # Infrastructure first, then dependent packages.
          restore_order <- c(
            "BiocGenerics","S4Vectors","IRanges","XVector","S4Arrays",
            "SparseArray","DelayedArray","MatrixGenerics","GenomicRanges",
            "Biobase","BiocParallel","SummarizedExperiment","preprocessCore",
            "limma","edgeR","DESeq2","BiocVersion","airway"
          )
          restored <- character()
          for(pkg in restore_order) {
            if(pkg %in% names(expected) &&
               restore_one(pkg,unname(bioc_repo[[pkg]])))
              restored <- c(restored,pkg)
          }
          stopifnot(all(vapply(c(required_cran,required_bioc),
                               requireNamespace,logical(1),quietly=TRUE)))
          cat("Frozen CRAN snapshot:",snapshot,"\n")
          cat("Bioconductor exact-version restores:",
              if(length(restored))paste(restored,collapse=",") else "none","\n")
          RSCRIPT
      - name: Verify exact recorded versions of all pinned reference packages (fail closed)
        run: Rscript multiomics-engine/environment/check_reference_runtime.R verify
      - name: Reject forged R q-values and verify true-null BH algorithmic oracle
        run: |
          Rscript multiomics-engine/tests/test_reference_inference_audit.R
          Rscript multiomics-engine/validation/rnaseq_bh_oracle.R tmp/reference-methods
      - name: Run real global-null DESeq2, edgeR-QL and limma-voom checks
        run: Rscript multiomics-engine/tests/bioconductor_null_calibration.R
      - name: Run independent mixed-truth FDR, power and effect-direction checks
        run: Rscript multiomics-engine/tests/bioconductor_mixed_truth_reference.R
      - name: Preserve all scientific results, including negative outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiomics-frozen-r-calibration-evidence
          path: |
            tmp/reference-runtime/
            tmp/reference-methods/
            multiomics-engine/environment/reference-runtime-inventory.json
          if-no-files-found: warn
          retention-days: 45
