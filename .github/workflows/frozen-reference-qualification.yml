name: Frozen R reference — calibration and negative-control qualification

on:
  pull_request:
    paths:
      - 'multiomics-engine/environment/**'
      - 'multiomics-engine/tests/bioconductor_null_calibration.R'
      - 'multiomics-engine/tests/bioconductor_mixed_truth_reference.R'
      - 'multiomics-engine/reference_inference_audit.R'
      - 'multiomics-engine/tests/test_reference_inference_audit.R'
      - 'multiomics-engine/validation/rnaseq_bh_oracle.R'
      - '.github/workflows/frozen-reference-qualification.yml'
  # The release assembler requires an independently reproducible passing
  # scientific result on the *exact* immutable published SHA, even when a
  # commit changes only JS/UI/other methods. Path-filtered main pushes gave
  # a permanently stale source pin and prevented visible header updates.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-reference:
    name: Pinned R/Bioconductor, global null and planted truth
    runs-on: ubuntu-latest
    timeout-minutes: 85
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    env:
      MULTIOMICS_NULL_REPLICATES: '8'
      MULTIOMICS_NULL_STRESS_REPLICATES: '8'
      MULTIOMICS_MIXED_REFERENCE_REPLICATES: '8'
      MULTIOMICS_VALIDATION_OUTPUT: tmp/reference-methods
    steps:
      - uses: actions/checkout@v5
      - name: Parse all native BH audit scripts before costly R installation
        run: |
          Rscript -e 'for(f in c(
            "multiomics-engine/reference_inference_audit.R",
            "multiomics-engine/validation/rnaseq_bh_oracle.R",
            "multiomics-engine/tests/test_reference_inference_audit.R",
            "multiomics-engine/tests/bioconductor_null_calibration.R",
            "multiomics-engine/tests/bioconductor_mixed_truth_reference.R"
          )) parse(file=f); cat("R inference audit syntax PASS\\n")'
      - name: Install required genuine R packages from frozen 2026-10-16 repositories
        shell: bash
        env:
          MULTIOMICS_R_SNAPSHOT: '2026-10-16'
        run: |
          Rscript -e '
            snapshot<-Sys.getenv("MULTIOMICS_R_SNAPSHOT")
            cran<-paste0("https://p3m.dev/cran/",snapshot)
            bioc<-paste0("https://p3m.dev/bioconductor/",snapshot)
            options(repos=c(CRAN=cran),BioC_mirror=bioc)
            Sys.setenv(
              BIOCONDUCTOR_CONFIG_FILE=paste0(bioc,"/config.yaml"),
              R_BIOC_VERSION="3.22"
            )
            if(!requireNamespace("BiocManager",quietly=TRUE))
              install.packages("BiocManager",repos=cran)
            stopifnot(identical(as.character(getRversion()),"4.5.2"))
            stopifnot(identical(as.character(BiocManager::version()),"3.22"))
            required_cran<-c("jsonlite","statmod","plumber","knitr","rmarkdown")
            missing<-required_cran[!vapply(required_cran,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing))install.packages(missing,repos=cran)
            required_bioc<-c("DESeq2","edgeR","limma","airway")
            missing<-required_bioc[!vapply(required_bioc,requireNamespace,logical(1),quietly=TRUE)]
            if(length(missing))BiocManager::install(missing,ask=FALSE,update=FALSE,quiet=TRUE)
            stopifnot(all(vapply(c(required_cran,required_bioc),
                                 requireNamespace,logical(1),quietly=TRUE)))
            cat("Frozen CRAN/Bioconductor snapshot:",snapshot,"\n")
          '
      - name: Verify exact recorded versions of all pinned reference packages (fail closed)
        run: Rscript multiomics-engine/environment/check_reference_runtime.R verify
      - name: Reject forged R q-values and verify true-null BH algorithmic oracle
        run: |
          Rscript multiomics-engine/tests/test_reference_inference_audit.R
          Rscript multiomics-engine/validation/rnaseq_bh_oracle.R tmp/reference-methods
      - name: Run real global-null DESeq2, edgeR-QL and limma-voom checks
        run: Rscript multiomics-engine/tests/bioconductor_null_calibration.R
      - name: Run independent mixed-truth FDR, power and effect-direction checks
        run: Rscript multiomics-engine/tests/bioconductor_mixed_truth_reference.R
      - name: Preserve all scientific results, including negative outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-frozen-r-calibration-evidence
          path: |
            tmp/reference-runtime/
            tmp/reference-methods/
            multiomics-engine/environment/reference-runtime-inventory.json
          if-no-files-found: warn
          retention-days: 45
