name: MultiOmics fixed-URL integration artifact

on:
  push:
    branches: [main, 'integration/pmx-legacy-url-overlay-*']
  pull_request:
    paths:
      - 'svelte.config.js'
      - 'src/**'
      - 'static/**'
      - 'scripts/build_pmx_compat_overlay.mjs'
      - 'scripts/test_pmx_compat_overlay.mjs'
      - 'scripts/build_short_url_overlay.mjs'
      - 'scripts/test_short_url_overlay.mjs'
      - '.github/workflows/pmx-fixed-url-artifact.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-url-artifact:
    name: Build MultiOmics for existing rberrah.github.io URLs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency tree
        run: npm ci
      - name: Static build compatible with existing /pharmacometrie/multiomics/ URLs
        env:
          BASE_PATH: /pharmacometrie
        run: npm run build
      - name: Stage only namespaced MultiOmics pages and assets
        run: node scripts/build_pmx_compat_overlay.mjs
      - name: Verify route compatibility, cryptographic hashes and file allowlist
        run: node scripts/test_pmx_compat_overlay.mjs
      # A second independent build resolves /multiomics/ directly from the
      # origin root instead of redirecting to /pharmacometrie/multiomics/.
      # PMx must explicitly adopt it in a separate, reviewed integration PR.
      - name: Build direct /multiomics/ without a project or PMx base prefix
        env:
          BASE_PATH: ''
        run: npm run build
      - name: Stage and validate direct short-URL root payload
        run: |
          node scripts/build_short_url_overlay.mjs
          node scripts/test_short_url_overlay.mjs
      - name: Upload proposed direct URL; never deploy from this repository
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-root-short-url-${{ github.sha }}
          path: short-url-overlay/
          if-no-files-found: error
          retention-days: 14
      - name: Store integration artifact; never deploy automatically
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-fixed-urls-${{ github.sha }}
          path: compat-overlay/
          if-no-files-found: error
          retention-days: 14
