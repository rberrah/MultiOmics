name: Multi-omics real public Nutrimouse DIABLO biological validation

on:
  pull_request:
    paths:
      - '.github/workflows/nutrimouse-diablo-validation.yml'
      - 'multiomics-engine/tests/test_diablo_real_nutrimouse.R'
      - 'multiomics-engine/tests/test_diablo_real_nutrimouse_ablation.R'
      - 'multiomics-engine/tests/test_real_nutrimouse_frozen_individual_score.R'
      - 'scripts/export_real_nutrimouse_frozen_score.mjs'
      - 'scripts/validate_multiomics_exchange.py'
      - 'src/lib/multiomics/downstream-exchange.js'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/validation_benchmarks.R'
      - 'multiomics-engine/environment/**'
  # The release assembler requires an independently reproducible passing
  # scientific result on the *exact* immutable published SHA, even when a
  # commit changes only JS/UI/other methods. Path-filtered main pushes gave
  # a permanently stale source pin and prevented visible header updates.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-paired-studies:
    name: Real mixOmics DIABLO on 40 Nutrimouse animals with true RNA-lipid pairing
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: Download immutable official mixOmics experimental source
        uses: actions/checkout@v5
        with:
          repository: mixOmics-org/mixOmics
          ref: ef3e760526623d9e91e945e4b50be48d764efc40
          path: external/mixOmics
          sparse-checkout: |
            data/nutrimouse.rda
      - name: Assert immutable R 4.5.2 / Bioconductor 3.22
        run: Rscript -e 'stopifnot(identical(as.character(getRversion()),"4.5.2"),requireNamespace("BiocManager",quietly=TRUE),identical(as.character(BiocManager::version()),"3.22"))'
      - name: Install real mixOmics plus JSON audit dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq libglpk40
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install("mixOmics",version="3.22",ask=FALSE,update=FALSE); stopifnot(requireNamespace("mixOmics",quietly=TRUE))'
      - name: Reject unpinned DIABLO package version or R/Bioconductor drift
        run: Rscript multiomics-engine/environment/verify_nutrimouse_runtime.R diablo verify
      - name: Run genuine paired multi-omic DIABLO with untouched subjects and negative controls
        run: |
          Rscript multiomics-engine/tests/test_diablo_real_nutrimouse.R \
            external/mixOmics tmp/multiomics/real-nutrimouse-diablo
      - name: Compare genuine DIABLO against actual single-omic sPLS-DA on identical heldouts
        run: |
          Rscript multiomics-engine/tests/test_diablo_real_nutrimouse_ablation.R \
            external/mixOmics tmp/multiomics/real-nutrimouse-diablo
      - name: Compute actual predeclared train-frozen per-animal liver gene scores in R
        run: |
          Rscript multiomics-engine/tests/test_real_nutrimouse_frozen_individual_score.R \
            external/mixOmics tmp/multiomics/real-nutrimouse-frozen-score
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Independently recompute heldout scores, validate frozen hashes and export original assays
        run: |
          node scripts/export_real_nutrimouse_frozen_score.mjs \
            tmp/multiomics/real-nutrimouse-frozen-score
      - name: Strictly validate actual study exchange archive with independent Python parser
        run: |
          python3 scripts/validate_multiomics_exchange.py \
            tmp/multiomics/real-nutrimouse-frozen-score/exchange
      - name: Preserve genuine frozen-score model, full source and negative result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nutrimouse-public-real-frozen-assay-score-not-pk-validated
          path: tmp/multiomics/real-nutrimouse-frozen-score/
          if-no-files-found: warn
      - name: Archive ALL outcomes even if observed model performs poorly
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-real-nutrimouse-diablo-true-observations
          path: tmp/multiomics/real-nutrimouse-diablo/
          if-no-files-found: warn
