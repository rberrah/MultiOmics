name: Multi-omics real Nutrimouse MOFA2 factor and experimental-effect audit

on:
  pull_request:
    paths:
      - '.github/workflows/nutrimouse-mofa-validation.yml'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/mofa_real_metadata_audit.R'
      - 'multiomics-engine/tests/test_mofa_real_nutrimouse_audit.R'
      - 'multiomics-engine/tests/test_mofa_real_nutrimouse.R'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nutrimouse-mofa-validation.yml'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/mofa_real_metadata_audit.R'
      - 'multiomics-engine/tests/test_mofa_real_nutrimouse_audit.R'
      - 'multiomics-engine/tests/test_mofa_real_nutrimouse.R'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-math:
    name: Strict genotype/diet post-fit metadata and factor-matching contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Test factor identity, conditional partial R2 and stratified permutations in base R
        run: Rscript multiomics-engine/tests/test_mofa_real_nutrimouse_audit.R

  real-mofa2:
    name: Genuine MOFA2 on Nutrimouse paired omics, two seeds and mispaired assay
    runs-on: ubuntu-latest
    needs: metadata-math
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned public mixOmics Nutrimouse study
        uses: actions/checkout@v5
        with:
          repository: mixOmics-org/mixOmics
          ref: ef3e760526623d9e91e945e4b50be48d764efc40
          path: external/mixOmics
          sparse-checkout: |
            data/nutrimouse.rda
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install authentic MOFA2, Basilisk and python/HDF5 requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhdf5-dev libglpk40
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install(c("MOFA2","basilisk"),version="3.22",ask=FALSE,update=FALSE); stopifnot(requireNamespace("MOFA2",quietly=TRUE),requireNamespace("basilisk",quietly=TRUE))'
      - name: Fit genuine MOFA2 on real Nutrimouse and audit genotype/diet separately
        run: |
          Rscript multiomics-engine/tests/test_mofa_real_nutrimouse.R \
            external/mixOmics tmp/multiomics/mofa-nutrimouse-real
      - name: Preserve all model factors, source provenance, permutations and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-real-nutrimouse-MOFA2-metadata-evidence
          path: tmp/multiomics/mofa-nutrimouse-real/
          if-no-files-found: warn
