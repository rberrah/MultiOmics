name: Multi-omics real Nutrimouse MOFA2 factor and experimental-effect audit

on:
  pull_request:
    paths:
      - '.github/workflows/nutrimouse-mofa-validation.yml'
      - 'multiomics-engine/advanced_methods.R'
      - 'multiomics-engine/environment/**'
      - 'scripts/verify_mofa_basilisk_evidence.py'
      - 'scripts/test_mofa_python_lock.py'
      - 'multiomics-engine/mofa_real_metadata_audit.R'
      - 'multiomics-engine/tests/test_mofa_real_nutrimouse_audit.R'
      - 'multiomics-engine/tests/test_mofa_real_nutrimouse.R'
  # The release assembler requires an independently reproducible passing
  # scientific result on the *exact* immutable published SHA, even when a
  # commit changes only JS/UI/other methods. Path-filtered main pushes gave
  # a permanently stale source pin and prevented visible header updates.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-math:
    name: Strict genotype/diet post-fit metadata and factor-matching contracts
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Assert immutable R 4.5.2 / Bioconductor 3.22
        run: Rscript -e 'stopifnot(identical(as.character(getRversion()),"4.5.2"),requireNamespace("BiocManager",quietly=TRUE),identical(as.character(BiocManager::version()),"3.22"))'
      - name: Test factor identity, conditional partial R2 and stratified permutations in base R
        run: Rscript multiomics-engine/tests/test_mofa_real_nutrimouse_audit.R

  real-mofa2:
    name: Genuine MOFA2 on Nutrimouse paired omics, two seeds and mispaired assay
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_22-r-4.5.2@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    needs: metadata-math
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned public mixOmics Nutrimouse study
        uses: actions/checkout@v7
        with:
          repository: mixOmics-org/mixOmics
          ref: ef3e760526623d9e91e945e4b50be48d764efc40
          path: external/mixOmics
          sparse-checkout: |
            data/nutrimouse.rda
      - name: Assert immutable R 4.5.2 / Bioconductor 3.22
        run: Rscript -e 'stopifnot(identical(as.character(getRversion()),"4.5.2"),requireNamespace("BiocManager",quietly=TRUE),identical(as.character(BiocManager::version()),"3.22"))'
      - name: Install authentic MOFA2, Basilisk and python/HDF5 requirements
        run: |
          apt-get update -qq
          apt-get install -y -qq libhdf5-dev libglpk40
          Rscript -e 'if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",repos="https://cloud.r-project.org")'
          Rscript -e 'if(!requireNamespace("BiocManager",quietly=TRUE)) install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install(c("MOFA2","basilisk"),version="3.22",ask=FALSE,update=FALSE); stopifnot(requireNamespace("MOFA2",quietly=TRUE),requireNamespace("basilisk",quietly=TRUE))'
      - name: Require exact MOFA2 and basilisk versions before authentic fitting
        run: Rscript multiomics-engine/environment/verify_nutrimouse_runtime.R mofa verify
      - name: Fit genuine MOFA2 on real Nutrimouse and audit genotype/diet separately
        run: |
          Rscript multiomics-engine/tests/test_mofa_real_nutrimouse.R \
            external/mixOmics tmp/multiomics/mofa-nutrimouse-real
      - name: Audit actual isolated basilisk Python environment used by MOFA2
        run: Rscript multiomics-engine/environment/audit_mofa_python.R verify
      - name: Independently verify Basilisk evidence and pinned source SHA
        run: python3 scripts/verify_mofa_basilisk_evidence.py tmp/multiomics/mofa-nutrimouse-real/basilisk_python_environment.json
      - name: Preserve all model factors, source provenance, permutations and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiomics-real-nutrimouse-MOFA2-metadata-evidence
          path: tmp/multiomics/mofa-nutrimouse-real/
          if-no-files-found: warn
